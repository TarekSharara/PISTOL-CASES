<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pistol Finder">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14213d">
<title>Pistol Malfunctions &amp; Irregularities Finder</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#16181d;--muted:#5d6472;--line:#dfe2e8;
  --navy:#14213d;--accent:#c8102e;--am:#1b7f4b;--nam:#b3261e;--chip:#eef0f4;--hl:#ffe58a;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--card:#181b21;--ink:#e9ebef;--muted:#9aa2b1;--line:#2a2f38;
  --navy:#0b1328;--chip:#232831;--hl:#6b5a12;--am:#3fbf7f;--nam:#ff6b61;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Calibri,"Carlito","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.45}
.ar,[dir=rtl]{font-family:Arial,"Noto Naskh Arabic",sans-serif}
header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left));position:sticky;top:0;z-index:5}
.hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;max-width:980px;margin:0 auto}
.brand{display:flex;gap:10px;align-items:flex-start;min-width:0}
.logo{width:44px;height:44px;flex-shrink:0;border-radius:10px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.logo svg{width:100%;height:100%;display:block}
h1{font-size:1.2rem;margin:0;line-height:1.2}
h1 .by{display:block;font-size:.85rem;font-weight:normal;opacity:.8;margin-top:3px}
h1 .ar{display:block;text-align:left;font-size:1rem;font-weight:normal;opacity:.85;margin-top:2px}
.lang{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden;flex-shrink:0}
.lang button{background:none;border:0;color:#fff;padding:6px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.lang button.on{background:#fff;color:var(--navy);font-weight:bold}
.tabs{display:flex;gap:4px;max-width:980px;margin:12px auto 0}
.tabs button{flex:1;background:rgba(255,255,255,.08);color:#fff;border:0;border-radius:8px 8px 0 0;
  padding:10px 6px;font:inherit;font-weight:bold;cursor:pointer}
.tabs button.on{background:var(--bg);color:var(--ink)}
main{max-width:980px;margin:0 auto;padding:14px 14px 40px}
.search{position:relative}
.search input{width:100%;padding:12px 40px 12px 14px;font:inherit;font-size:1.05rem;border:1px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--ink)}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;
  color:var(--muted);font-size:1.3rem;cursor:pointer;padding:4px 8px}
.fbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fbtn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:58px;padding:8px 34px 8px 12px;position:relative;
  border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.fbtn::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1.1rem}
.fbtn .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:bold}
.fbtn .v{font-weight:bold;font-size:1rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fbtn.set{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.fbtn.set .k{color:var(--accent)}
.active{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.active:empty{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;border:0;border-radius:999px;
  padding:6px 8px 6px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.pill span.x{background:rgba(255,255,255,.2);border-radius:50%;width:20px;height:20px;display:inline-grid;place-items:center;font-size:.75rem}
.pill.clear{background:none;color:var(--accent);padding:6px 4px;text-decoration:underline}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:18px 18px 0 0;max-height:85vh;
  display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom);
  max-width:640px;margin:0 auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 4px}
.sh-head b{font-size:1.1rem}
.sh-head button{border:0;background:var(--chip);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:1rem;cursor:pointer}
.sh-body{overflow-y:auto;padding:4px 16px 18px;-webkit-overflow-scrolling:touch}
.sh-group{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:bold;margin:12px 2px 6px}
.sh-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{position:relative;display:flex;flex-direction:column;justify-content:center;min-height:62px;padding:8px 40px 8px 12px;
  border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer;line-height:1.2}
.opt.full{grid-column:1/-1}
.opt .o-en{font-weight:bold}
.opt .o-ar{font-family:Arial,sans-serif;color:var(--muted);font-size:.9rem;margin-top:3px;text-align:right;direction:rtl}
.opt .n{position:absolute;right:8px;top:8px;background:var(--chip);color:var(--muted);border-radius:999px;font-size:.75rem;
  min-width:24px;padding:1px 6px;text-align:center;font-weight:bold}
.opt.on{background:var(--navy);border-color:var(--navy);color:#fff}
.opt.on .o-ar{color:#cfd6e6}.opt.on .n{background:rgba(255,255,255,.2);color:#fff}
.opt.zero{opacity:.45}
body.en .o-ar,body.ar .o-en{display:none}
body.ar .opt .o-ar{color:inherit;font-weight:bold;font-size:1rem;margin:0}
body.ar .opt{text-align:right;padding:8px 12px 8px 40px}body.ar .opt .n{right:auto;left:8px}
body.noscroll{overflow:hidden}
.flabel{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 6px;font-weight:bold}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chips button{white-space:nowrap;border:1px solid var(--line);background:var(--chip);color:var(--ink);
  border-radius:999px;padding:6px 12px;font:inherit;font-size:.9rem;cursor:pointer}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){.chips button.on{background:#e9ebef;color:#111;border-color:#e9ebef}}
.count{font-size:.9rem;color:var(--muted);margin:14px 2px 8px;display:flex;justify-content:space-between;gap:8px}
.count button{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.card.flash{box-shadow:0 0 0 3px var(--accent)}
.ch{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;cursor:pointer;width:100%;
  background:none;border:0;text-align:left;color:inherit;font:inherit}
.rule{flex-shrink:0;background:var(--accent);color:#fff;border-radius:6px;padding:2px 8px;font-weight:bold;
  font-size:.82rem;margin-top:2px;white-space:nowrap}
.ttl{flex:1;min-width:0}
.ttl .en{font-weight:bold}
.ttl .ar{display:block;font-size:.95rem;color:var(--muted);text-align:right;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:.72rem;background:var(--chip);color:var(--muted);border-radius:4px;padding:1px 6px}
.chev{flex-shrink:0;color:var(--muted);transition:transform .15s;margin-top:2px}
.card.open .chev{transform:rotate(90deg)}
.cb{display:none;border-top:1px solid var(--line);padding:4px 14px 12px}
.card.open .cb{display:block}
.cols{display:grid;gap:14px}
body.both .cols{grid-template-columns:1fr 1fr}
@media (max-width:720px){body.both .cols{grid-template-columns:1fr}}
.col p{margin:8px 0}
.col.ar p{text-align:right}
body.en .col.ar, body.ar .col.en{display:none}
body.ar .ttl .en{display:none} body.ar .ttl .ar{font-size:1.02rem;color:var(--ink);font-weight:bold;margin:0}
body.en .ttl .ar{display:none}
p.h{font-weight:bold}
mark{background:var(--hl);color:inherit;border-radius:2px}
a.ref{color:var(--accent);font-weight:bold;text-decoration:underline dotted;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
/* wizard */
.step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.step h3{margin:0 0 8px;font-size:1rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.step h3 .ar{font-weight:normal;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.opts button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:10px;
  font:inherit;text-align:left;cursor:pointer;line-height:1.25}
.opts button small{display:block;color:var(--muted);font-family:Arial,sans-serif;text-align:right;margin-top:3px}
.opts button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.opts button.on small{color:#cfd6e6}
.opts button.am.on{background:var(--am);border-color:var(--am)}
.opts button.nam.on{background:var(--nam);border-color:var(--nam)}
.hint{font-size:.88rem;color:var(--muted);margin-top:8px}
.hint a{color:var(--accent);cursor:pointer;font-weight:bold}
.result{border:2px solid var(--navy);border-radius:12px;background:var(--card);padding:12px 14px}
@media (prefers-color-scheme:dark){.result{border-color:#5d6a8a}}
.result h3{margin:0 0 6px}
.result ol{margin:6px 0;padding-inline-start:22px}
.result li{margin:5px 0}
.result .ar ol{direction:rtl}
.result .sub{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:bold;margin-top:10px}
.rl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rl button{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:6px;padding:4px 10px;
  font:inherit;font-weight:bold;font-size:.85rem;cursor:pointer}
.reset{margin-top:10px;border:0;background:none;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer}
footer{max-width:980px;margin:0 auto;padding:0 14px 30px;color:var(--muted);font-size:.82rem;text-align:center}
.hidden{display:none!important}
</style>
</head>
<body class="both">
<header>
  <div class="hrow">
    <div class="brand"><span class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#ffffff"/><circle cx="32" cy="32" r="24" fill="#16181d"/><circle cx="32" cy="32" r="18" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="32" cy="32" r="12" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="32" cy="32" r="6" fill="#fff"/><circle cx="32" cy="32" r="2.2" fill="#16181d"/><path d="M32 3v10M32 51v10M3 32h10M51 32h10" stroke="#c8102e" stroke-width="3" stroke-linecap="round"/></svg></span><h1>Pistol Malfunctions &amp; Irregularities<span class="ar" dir="rtl">دليل أعطال ومخالفات المسدس</span><span class="by">By: Tarek Sharara</span></h1></div>
    <div class="lang" role="group" aria-label="Language">
      <button data-l="en">EN</button><button data-l="both" class="on">EN+ع</button><button data-l="ar">ع</button>
    </div>
  </div>
  <div class="tabs">
    <button data-t="finder" class="on">Finder · البحث</button>
    <button data-t="wizard">Malfunction Guide · دليل العطل</button>
  </div>
</header>

<main>
  <section id="finder">
    <div class="search">
      <input id="q" type="search" placeholder="Search… e.g. slide jam, protest, عطل, شكوى" autocomplete="off">
      <button id="clr" aria-label="Clear">×</button>
    </div>
    <div class="fbar">
      <button class="fbtn" id="fbEv" data-sheet="ev"></button>
      <button class="fbtn" id="fbCat" data-sheet="cat"></button>
    </div>
    <div class="active" id="active"></div>
    <div class="count"><span id="cnt"></span><span><button id="expand">Expand all</button></span></div>
    <div id="list"></div>
  </section>

  <section id="wizard" class="hidden">
    <div id="wsteps"></div>
  </section>
</main>
<div class="sheet-bg hidden" id="sheetBg"></div>
<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sh-head"><b id="shTitle"></b><button id="shClose" aria-label="Close">✕</button></div>
  <div class="sh-body" id="shBody"></div>
</div>
<footer>Rule text: ISSF General Technical Rules (6) &amp; Pistol Rules (8), Arabic translation A-678 V3 (15/11/2026) by International Judge Tarek Sharara.<br><span dir="rtl" class="ar">النصوص من ترجمة الحكم الدولي طارق شرارة – الطبعة الثالثة</span></footer>

<script>
const RULES = [{"id": "6.10.5", "rule": "6.10.5", "te": "EST scoring complaint during sighting shots", "ta": "شكاوى الدرجات أثناء طلقات الاختبار", "cats": ["CMP", "EST"], "ev": ["AP10", "P50", "MTQ"], "en": ["6.10.5 Target Scoring Complaints During Sighting Shots", "If an athlete complains during sighting shots about the correct recording or evaluation of the shot(s), the Jury may offer to move him to another firing point.", "a) The athlete will be given appropriate extra time;", "b) The Jury will, as soon as possible, examine the sighting shot(s) on the original firing point by applying the Procedure for EST Examination; and", "c) If this subsequent examination confirms that the target on the original firing point provided correct results, the athlete will be penalized with the DEDUCTION of two (2) points from the lowest value shot of his first competition series."], "ar": ["6.10.5 شكاوى الدرجات أثناء طلقات الاختبار", "إذا اشتكى أحد اللاعبين خلال طلقات الاختبار عن التسجيل الصحيح أو تقييم طلقة/طلقات، فيمكن للجنة الحكام أن تعرض نقله إلى نقطة رمي أخرى.", "(a)سيعطى اللاعب وقت إضافي مناسب.", "(b)تقوم لجنة الحكام (Jury)، في أقرب وقت ممكن، ستفحص طلقة/طلقات الاختبار في نقطة الرمي الأصلية بتطبيق إجراءات فحص أنظمة الأهداف الالكترونية EST. و", "(c)إذا أكد هذا الفحص لاحقا أن الهدف في نقطة الرمي الأصلية كان يعطى نتائج صحيحة، فسوف يعاقب اللاعب بخصم نقطتين اثنتين (2) من أدنى قيمة طلقة في أول مجموعة له في المباراة."]}, {"id": "6.10.6", "rule": "6.10.6", "te": "Paper / rubber band fails to advance", "ta": "فشل تحرك الشريط الورقي أو المطاطي", "cats": ["CMP", "EST"], "ev": ["AP10", "P50", "MTQ"], "en": ["6.10.6  Failure of the Paper or Rubber Band to Advance", "If the Jury confirms that the problem causing an athlete complaint is because the paper or rubber band is not advancing properly:", "a) The athlete will be moved to a reserve position;", "b) He will be permitted unlimited sighting shots to be taken within the time remaining for the event plus any additional time granted;", "c) He will repeat the number of MATCH shots determined by the Jury plus the number of shots necessary to complete the event;", "d) After the relay, the RTS Jury will decide which shots are to be counted from each target; and", "e) The athlete will be credited with the scores of all shots that were correctly displayed on the monitor of the first target, plus the scores of all MATCH shots fired on the second target that were necessary to complete the course of fire."], "ar": ["6.10.6 فشل تحرك الشريط الورقي أو المطاطي", "إذا أكدت لجنة الحكام (Jury) أن المشكلة التي تسببت في شكوى لاعب ناتجة عن عدم تقدم شريط الورق أو الشريط المطاطي بشكل صحيح:", "(a)يتم نقل اللاعب إلى نقطة احتياطية.", "(b)يسمح له بطلقات اختبار غير محدودة ضمن الوقت المتبقي لهذه المسابقة بالإضافة إلى أي وقت إضافي ممنوح؛", "(c)يعيد عدد طلقات المباراة التي تحددها لجنة الحكام (Jury) بالإضافة إلى عدد من الطلقات اللازمة لإتمام هذه المسابقة؛", "(d)بعد انتهاء القطار، سوف تقرر لجنة حكام النتائج RTS الطلقات التي ستحتسب من كل هدف. و", "(e)سيحتسب للاعب درجات جميع الطلقات التي تم تسجيلها بشكل صحيح على شاشة الهدف الأول، بالإضافة إلى درجات جميع طلقات المباراة MATCH على الهدف الثاني التي كانت ضرورية لاستكمال المسابقة."]}, {"id": "6.10.7", "rule": "6.10.7", "te": "Protest concerning a shot value (EST)", "ta": "احتجاج بشأن قيمة طلقة", "cats": ["CMP"], "ev": ["AP10", "P50", "MTQ", "RFP", "SP", "P25"], "en": ["6.10.7  Protest Concerning a Shot Value", "If a shot registers and displays, but the athlete protests the value indicated in accordance with Rule 6.16.5.2:", "a) After the relay, the detailed printer results (LOG-Print) must be generated by the Technical or Range Officers for all firing lanes on which complaints or protests have been made, and for the immediately adjacent lanes, before the target systems are reset for the next relay;", "b) After the completion of the relay, the Procedure for EST Examination will be applied;", "c) Any non-indicated or incorrectly indicated shot must be scored by the RTS Jury; and", "d) If the RTS Jury determines that a protested shot was scored correctly, a two (2) point penalty will be applied (6.16.5.2.c)."], "ar": ["6.10.7 احتجاج بشأن قيمة طلقة", "لو تم تسجيل طلقة وعرضها، لكن اعترض اللاعب على قيمتها طبقا للقاعدة 6.16.5.2", "(a)بعد انتهاء القطار، يجب على المسؤولين الفنيين أو مسؤولي الميدان استخراج تقارير النتائج المفصلة للطابعة (السجل – LOG-PRINT) لجميع نقاط الرمي الذين قدموا شكاوى أو احتجاجات، ونقاط الرمي المجاورة مباشرة، وذلك قبل إعادة الضبط الأصلي (Reset) لأنظمة الأهداف للقطار التالي.", "(b)بعد الانتهاء من القطار، سيتم تطبيق إجراءات فحص الأهداف الالكترونية EST؛ و", "(c)أي طلقة لم تسجل أو سجلت بشكل غير صحيح لابد من تقديرها بواسطة لجنة حكام RTS. و", "(d)إذا قررت لجنة حكام RTS أن الطلقة موضوع الاحتجاج تم تقديرها بشكل صحيح، يتم تطبيق عقوبة خصم نقطتين وفقا للقاعدة (6.16.5.2 c)."]}, {"id": "6.10.8", "rule": "6.10.8", "te": "Procedure for examining EST after a score protest or complaint", "ta": "إجراءات فحص الأهداف الإلكترونية بعد الاحتجاج أو الشكوى", "cats": ["CMP", "EST"], "ev": ["AP10", "P50", "MTQ", "RFP", "SP", "P25"], "en": ["6.10.8 PROCEDURE FOR EXAMINING ELECTRONIC SCORING TARGETS FOLLOWING A SCORE PROTEST OR COMPLAINT", "6.10.8.1 If there is a score protest, complaint or no indication of a shot, etc., a Jury Member must collect the following items (the number of the firing point and the orientation of the card, sheet or target, the relay and series and the time of collection must be noted on each):", "a) The Control Sheet (25m / 50m). If the location of any shot hole is out of the area of the Control Sheet, the geometric relation between the shot holes on the Control Sheet and the Backing Card must be made before the Control Sheet is removed", "b) The Backing Card (25m / 50m / 300m);", "c) The Backing Target (25m);", "d) The black paper strip (10m);", "e) The black rubber band (50m);", "f) The Range Incident Report;", "g) The LOG print; and", "h) The data record from the electronic scoring target computer (if necessary).", "6.10.8.2 A Jury Member must examine the face of the EST and the frame and record the location of any shots outside the black aiming mark.", "6.10.8.3 No CLEAR LOG must be made before the RTS Jury has given permission.", "6.10.8.4 The number of shot holes must be counted and their location taken into account.", "6.10.8.5 Jury Members must examine these items and then make independent assessments before a formal Jury decision is made.", "6.10.8.6 A Jury Member must supervise any manual intervention of the control computer results (e.g. the recording of penalties, corrected scores after malfunctions etc.)."], "ar": ["6.10.8 إجراءات فحص الأهداف الالكترونية بعد الاحتجاج أو الشكوى", "6.10.8.1 إذا كان هناك احتجاج على التقدير، أو شكوى أو عدم تسجيل للطلقة، وما إلى ذلك، فلابد من قيام عضو لجنة الحكام بتجميع العناصر التالية (رقم نقطة الرمي وأي استنتاج من الكارت الخلفي، أو من لوحة الرقابة أو الهدف، ورقم القطار والمجموعة ووقت الجمع لكل عنصر:", "(a)ورقة التحكم (٢٥م/٥٠م). إذا كان موقع أي طلقة خارج المنطقة من ورقة التحكم (Control Sheet)، فلابد أن يتم عمل العلاقة الهندسية بين ثقوب الطلقات على ورقة التحكم (Control Sheet) والكارت الخلفي قبل إزالة ورقة التحكم (Control Sheet)؛", "(b)الكارت الخلفي (٢٥م/٥٠م/٣٠٠م)؛", "(c)الهدف الخلفي (٢٥م)؛", "(d)الشريط الورقي الأسود الخلفي (١٠م)؛", "(e)الشريط المطاطي الأسود (٥٠م)؛", "(f)تقرير وقائع/أحداث الميدان (IR)؛", "(g)سجل الطابعة؛ و", "(h)سجل البيانات من كمبيوتر الأهداف الالكترونية (إذا كان ضروريا).", "6.10.8.2 لابد من قيام عضو لجنة الحكام بفحص وجه الهدف الالكتروني والإطار وتسجيل موقع أي طلقات خارج العلامة السوداء (black aiming mark).", "6.10.8.3 لابد ألا يتم مسح السجل (CLEAR LOG) قبل سماح لجنة حكام RTS بذلك.", "6.10.8.4 لابد أن يحسب عدد ثقوب الطلقات ومواقعها وأخذها بعين الاعتبار.", "6.10.8.5 لابد على أعضاء لجنة الحكام فحص هذه العناصر ثم عمل التقييمات بشكل مستقل قبل اتخاذ أي قرار رسمي.", "6.10.8.6 لابد أن يشرف عضو لجنة الحكام على أي تدخل يدوي في نتائج مراقبة الكمبيوتر (على سبيل المثال تسجيل العقوبات، تصحيح الدرجات بعد الأعطال وما إلى ذلك)."]}, {"id": "6.10.9.1", "rule": "6.10.9.1 – 6.10.9.2", "te": "EST failure – all targets / a single target (10m / 50m)", "ta": "عطل الأهداف الإلكترونية – جميع الأهداف / هدف واحد (١٠م / ٥٠م)", "cats": ["EST", "CMP"], "ev": ["AP10", "P50", "MTQ"], "en": ["6.10.9 EST FAILURE", "These Rules apply to 10m, 50m and 300m EST. For procedures concerning 25m EST failures, see Rule 8.10. For procedures concerning Moving Target EST failures, see Rule 10.11.", "6.10.9.1 When ALL Targets on a Range Fail", "a) The time of failure and the expired shooting time must be recorded by the Chief Range Officer and the Jury;", "b) All completed competition shots of each athlete must be counted and recorded. In the event of a range power supply failure, this may involve waiting until the power supply is restored to enable the number of shots registered by the target, not necessarily on the firing point monitor, to be established; and", "c) After the failure is rectified and the full range is in operation, an additional five (5) minutes will be added to the competition time remaining. The time for recommencing is to be announced over the loudspeaker system at least five (5) minutes beforehand. Athletes must be allowed to resume their position in the five (5) minutes before the competition restarts. Unlimited sighting shots must be allowed during the remaining shooting time, but only before competition shots are resumed.", "6.10.9.2 When a SINGLE Target Fails", "a) If the EST cannot be repaired within five (5) minutes, the athlete must be moved to a reserve position;", "b) When he is ready to shoot, an additional five (5) minutes will be added to the competition time remaining; and", "c) He will be permitted unlimited sighting shots before he starts the remaining competition shots."], "ar": ["6.10.9 عطل الأهداف الالكترونية", "تنطبق هذه القواعد على ١٠م و٥٠م و٣٠٠م EST. للإجراءات الخاصة بأعطال الأهداف الالكترونية ٢٥م، أنظر القاعدة 8.10. وللإجراءات بخصوص أعطال الأهداف الالكترونية للأهداف المتحركة أنظر القاعدة 10.11.", "6.10.9.1 عند تعطل جميع الأجهزة في الميدان", "(a)لابد يقوم كل من رئيس ضباط الميدان (CRO) ولجنة الحكام بتسجيل وقت العطل والوقت المنصرم من زمن الرمي.", "(b)جميع طلقات المباراة التي تم إطلاقها لكل لاعب لابد أن تحتسب وتسجل. في حالة انقطاع التيار الكهربائي في الميدان، وهذا قد يتطلب الانتظار حتى يتم استعادة التيار الكهربائي حتى يمكن تحديد عدد الطلقات التي تم تسجيلها على كل هدف، وليس بالضرورة أن يكون تم تسجيلها على شاشة نقطة الرمي؛", "(c)بعد عودة التيار الكهربائي ويصبح الميدان جاهزا بشكل كامل، سيتم إضافة خمس (٥) دقائق للوقت المتبقي من المباراة. ويتم الإعلان عن الوقت المحدد لاستئناف المباراة بواسطة مكبر الصوت وذلك على الأقل ٥ دقائق قبل وقت استئناف المباراة. ولابد أن يسمح للاعبين باتخاذ أوضاعهم في الخمس (5) دقائق السابقة لاستئناف المباراة. ولابد من السماح بطلقات اختبار غير محدودة العدد خلال الوقت المتبقي للرمي، ولكن فقط قبل أن يتم استئناف طلقات المباراة.", "6.10.9.2 عند تعطل جهاز واحد", "(a)إذا كان لا يمكن إصلاح الجهاز في غضون خمس (5) دقائق، فلابد أن ينقل اللاعب إلى نقطة رمي احتياطية.", "(b)عندما يكون مستعد للرمي، ستضاف خمس (5) دقائق إضافية إلى وقت المباراة المتبقي؛ و", "(c)يتم السماح له بعدد غير محدود من طلقات الاختبار قبل أن يبدأ طلقات المباراة المتبقية."]}, {"id": "6.10.9.3", "rule": "6.10.9.3 – 6.10.9.4", "te": "Shot fails to register or display on the monitor (10m / 50m)", "ta": "عدم تسجيل طلقة أو عرضها على الشاشة (١٠م / ٥٠م)", "cats": ["EST", "CMP"], "ev": ["AP10", "P50", "MTQ"], "en": ["6.10.9.3 When a Shot Fails to Register or Display on the Monitor", "The athlete must immediately inform the nearest Range Officer of the failure. The Range Officer must make a written note of the time of the complaint. One or more Jury Member(s) must go to the firing position. The athlete must be directed to fire one more MATCH shot at his target: If the value and location of this shot is registered and displayed on the monitor:", "a) The athlete must be directed to continue the competition;", "b) The value, location and time of firing of this extra shot must be recorded, its shot-number (after including the missing shot) and its value and its shot- location, and the firing point number must be given to the Jury in writing and recorded on the Range Register and a Range Incident Report;", "c) After the end of that relay, the Procedure for EST Examination will be applied. Using this information and the time of the extra shot and its location, the RTS Jury will determine whether all shots, including the extra shot, are recorded on the computer record;", "d) If all the shots are recorded correctly, then the questioned shot (shot that did not register or display) will be counted in the score of the athlete, as well as the shot fired immediately after (as the “extra” shot), but the last shot fired (extra to the competition) will be annulled;", "e) If the questioned shot was not located by applying the Procedure for EST Examination or was confirmed as an off-target miss (Note: This means a questioned 10m shot could not be found on the witness strip or target face; a questioned 25m shot could not be found on the backing target, control sheet or backing card or there was evidence that a questioned 50m or 300m shot was an off-target miss), then the questioned shot must be scored as a miss and the last shot fired (extra to the competition) must be nullified; or", "f) If the questioned shot was found or was located in the computer memory, the RTS Jury must determine and count the score of the questioned shot; or", "g) If a questioned 50m or 300m shot is not found, the Jury must decide whether to score the missing shot as a miss and nullify the last shot or, if there is no credible evidence that the questioned shot was an off-target miss, the Jury may conclude that a target system anomaly occurred and count the extra shot in lieu of the missing shot and the last shot fired.", "6.10.9.4 OR: If the extra shot fired as directed does not register or display and the EST cannot be repaired within five (5) minutes:", "a) The athlete must be moved to a reserve position;", "b) When he is ready to shoot, an additional five (5) minutes will be added to the competition time remaining and he will be permitted unlimited sighting shots;", "c) In 10m and 50m Rifle and Pistol Events, the athlete will repeat the two (2) MATCH shots that did not register or display on the previous target used."], "ar": ["6.10.9.3 في حالة عدم تسجيل طلقة أو عرضها على الشاشة", "لابد على اللاعب فورا إبلاغ أقرب ضابط ميدان بالعطل. ويتعين على ضابط الميدان تدوين وقت الشكوى. لابد أن يتوجه عضو أو أكثر من أعضاء لجنة الحكام إلى نقطة الرمي. ولابد أن يوجه اللاعب لإطلاق طلقة مباراة واحدة على هدفه:", "فإذا تم تسجيل قيمة وموقع هذه الطلقة وعرضها على الشاشة:", "(a)لابد أن يوجه اللاعب لمواصلة المباراة.", "(b)لابد أن يتم تسجيل قيمة ومكان ووقت إطلاق هذه الطلقة الإضافية، ورقم هذه الطلقة (بعد احتساب الطلقة المفقودة)، وقيمتها وموقعها ورقم نقطة الرمي ولابد أن يقدم ذلك كتابة إلى لجنة الحكام وتسجل في سجل الميدان وتقرير وقائع/أحداث الميدان.", "(c)بعد نهاية هذا القطار، يتم تطبيق إجراءات فحص أنظمة الأهداف الالكترونية EST. وبالاستناد إلى هذه المعلومات ووقت الطلقة الإضافية وموقعها، سيحدد حكام RTS ما إذا كان تم تسجيل جميع الطلقات، بما في ذلك الطلقة الإضافية، في سجل الكمبيوتر؛", "(d)إذا تبين أن جميع الطلقات مسجلة بشكل صحيح، فإن الطلقة محل التساؤل (الطلقة التي لم تسجل أو لم تعرض) سوف تحتسب في نتيجة اللاعب، كما تحتسب الطلقة التي أطلقت مباشرة بعد ذلك (كطلقة إضافية)، ولكن تلغى الطلقة الأخيرة التي تم رميها (الزائدة عن المباراة)؛", "(e)إذا تعذر تحديد موضع الطلقة محل الاحتجاج بعد تطبيق إجراءات فحص الأهداف الالكترونية EST أو تأكد أنها خارج الهدف (ملاحظة: هذا يعني أنه الطلقة موضوع التساؤل في ١٠م لا يمكن العثور عليها على الشريط الشاهد أو وجه الهدف؛ الطلقة موضوع التساؤل في ٢٥م لا يمكن العثور عليها على الهدف الخلفي، وورقة التحكم (Control Sheet) أو الكارت الخلفي أو كان هناك دليل على أن الطلقة موضوع التساؤل في ٥٠م أو ٣٠٠م كانت خارج الهدف)، بالتالي لابد من تقييم الطلقة المفقودة باعتبارها صفر وآخر طلقة (اضافية للمباراة) لابد أن تلغى. أو", "(f)إذا تم العثور على الطلقة موضوع التساؤل أو كانت موجودة في ذاكرة الكمبيوتر، فلابد أن تقوم لجنة حكام RTS بتحديد وتقدير قيمة الطلقة موضوع التساؤل؛ أو", "(g)إذا لم يتم العثور على الطلقة موضوع التساؤل ٥٠م أو ٣٠٠م، فلابد أن تقرر لجنة الحكام إما باحتساب الطلقة المفقودة خارج الهدف (miss) وتلغي الطلقة الأخيرة، أو إذا لم يكن هناك دليل موثوق به أن الطلقة موضوع التساؤل كانت خارج الهدف، قد تستنتج لجنة الحكام أنه قد حدث خطأ من النظام الالكتروني وتحتسب الطلقة الإضافية الأخيرة بدلا من الطلقة المفقودة.", "6.10.9.4 أو: إذا كانت الطلقة الإضافية التي أطلقت وفقا للتوجيهات لم يتم تسجيلها أو عرضها على الشاشة ولا يمكن إصلاح نظام الأهداف الالكترونية EST خلال خمس (5) دقائق:", "(a)لابد من نقل اللاعب إلى نقطة رمي احتياطية (Reserve Position)؛", "(b)عندما يكون اللاعب جاهزا، يتم إضافة خمس (٥) دقائق إضافية للوقت المتبقي من وقت المباراة له ويسمح له بعدد غير محدود من طلقات الاختبار؛", "(c)في مسابقات ١٠م و٥٠م مسدس وبندقية، سيعيد اللاعب رمي الطلقتين (٢) المحتسبتين اللتين لم يتم تسجيلهما أو عرضهما على الهدف السابق المستخدم."]}, {"id": "6.16.2", "rule": "6.16.1 – 6.16.2", "te": "Protests – general & verbal protests", "ta": "الاحتجاجات – عام والاحتجاجات الشفهية", "cats": ["CMP"], "ev": ["AP10", "P50", "MTQ", "RFP", "SP", "P25"], "en": ["6.16 PROTESTS AND APPEALS", "6.16.1  All Protests and Appeals are to be decided in accordance with ISSF Rules.", "6.16.2  Verbal Protests", "6.16.2.1 Any athlete or team official has the right to protest a condition of the competition, decision or action of a competition official immediately and verbally to a Referee, Range Officer or Jury Member on the following matters:", "a) An athlete or team official considers that the ISSF Rules or the competition programme were not followed in conducting the competition;", "b) An athlete or team official does not agree with a decision or action by a competition official, Referee, Range Officer or Jury Member;", "c) An athlete was impeded or disturbed by other athlete(s), competition official(s), spectator(s), member(s) of the media or other person(s) or cause(s);", "d) An athlete had a long interruption in shooting caused by range equipment failure, the clarification of irregularities or other cause(s); and", "e) An athlete had irregularities regarding shooting times, including shooting times that were too short.", "6.16.2.2 Referees, Range Officers and Jury Members must consider verbal protests immediately. They may take immediate action to correct the situation or refer the protest to the full Jury for a decision. In such cases, a Referee, Range Officer or Jury Member may stop the shooting temporarily if necessary."], "ar": ["6.16 الاحتجاجات والاستئنافات", "6.16.1 كل الاحتجاجات والاستئنافات يتم البت فيها طبقا لقواعد الاتحاد الدولي لرياضة الرماية.", "6.16.2 الاحتجاجات الشفهية", "6.16.2.1 أي لاعب أو مسئول الفريق له الحق في الاحتجاج على أي موقف في المباراة، أو قرار أو تصرف لمسئول المباراة فورا وشفهيا إلى حكم (Referee)، أو ضابط الميدان (Range Officer) أو عضو لجنة الحكام (Jury Member) على الأمور التالية:", "(a)إذا اعتبر اللاعب أن قواعد الاتحاد الدولي لرياضة الرماية أو برنامج المسابقة لم يتم اتباعها في إدارة المباراة؛", "(b)عدم موافقة اللاعب أو مسئول الفريق على قرار أو إجراء من قبل مسؤول المنافسة، أو الحكم، أو ضابط الميدان (RO) أو عضو لجنة الحكام (Jury Member)؛", "(c)قد أعيق اللاعب أو انزعج من قبل لاعب/لاعبين آخر/آخرين، مسئول/مسئولي المنافسة، المتفرج/المتفرجين، وعضو/أعضاء وسائل الإعلام أو أي شخص أو سبب آخر؛", "(d)كان اللاعب قد انقطع لوقت طويل عن الرمي بسبب تعطل أجهزة الميدان، أو التعرض لأي أمور غير طبيعية أو لأي سبب آخر؛ و", "(e)حدوث أمور غير طبيعية للاعب متعلقة بوقت الرمي، بما في ذلك أن أزمنة الرمي كانت قصيرة جدا.", "6.16.2.2 لابد أن يقوم الحكام (Referee) وضباط الميادين (Range Officer) وأعضاء لجنة الحكام (Jury Members) بالنظر فورا في الاحتجاجات الشفهية. ويمكن اتخاذ إجراءات فورية لتصحيح الموقف، أو إحالة الاحتجاج إلى لجنة الحكام بالكامل لاتخاذ القرار. وفي مثل هذه الحالات، يجوز للحكم)، أو ضابط الميدان (RO) أو عضو لجنة الحكام (Jury Member) أن يوقف الرمي مؤقتا إذا لزم الأمر."]}, {"id": "6.16.3", "rule": "6.16.3 – 6.16.4", "te": "Written protests & protest fee", "ta": "الاحتجاجات المكتوبة ورسوم الاحتجاج", "cats": ["CMP"], "ev": ["AP10", "P50", "MTQ", "RFP", "SP", "P25"], "en": ["6.16.3  Written Protests", "Any athlete or team official who does not agree with the action or decision taken on a verbal protest may protest in writing to the Jury. Any athlete or team official also has the right to submit a written protest without making a verbal protest. All written protests must be submitted to a member of the appropriate Jury not later than 20 minutes after the matter in question, or after the end of the round where the incident occurred and the protest fee becomes payable. Written Protests and Appeals must be submitted on the ISSF Protest Form (see Protest Form at 6.19).", "6.16.4  A Protest Fee becomes payable when a written Protest or Appeal is submitted to a Jury member, as follows:", "a) Protest: 50,00 EUR;", "b) Appeal of Protest Decision: 100,00 EUR;", "c ) The Protest Fee becomes payable when a completed Protest Form is delivered to a Jury Member and must be paid to the Jury Member or Organizing Committee as soon as possible; and", "d) Protest and Appeal fees must be returned if the Protest or Appeal is upheld, or will be retained by the Organizing Committee if the Protest or Appeal is denied."], "ar": ["6.16.3 الاحتجاجات المكتوبة", "يجوز لأي لاعب أو مسؤول فريق لا يوافق على الإجراء أو القرار المتخذ بشأن احتجاج شفوي قد يقدم احتجاجا مكتوبا إلى لجنة الحكام (Jury). كما يحق لأي لاعب أو مسؤول فريق تقديم احتجاج مكتوب دون تقديم احتجاج شفوي. لابد من تقديم جميع الاحتجاجات المكتوبة إلى أحد أعضاء لجنة الحكام المختصة في موعد لا يتجاوز 20 دقيقة من وقت حدوث الواقعة محل الاحتجاج، أو بعد انتهاء الجولة التي حدثت فيها الواقعة، ويصبح رسم الاحتجاج مستحق السداد. الاحتجاجات المكتوبة والاستئناف لابد أن تقدم على نموذج الاحتجاج المعتمد من الاتحاد الدولي لرياضة الرماية (انظر نموذج الاحتجاج في 6.19).", "6.16.4 رسوم الاحتجاج تستحق السداد عند تقديم الاحتجاج أو الاستئناف إلى عضو لجنة الحكام (Jury Member) ، كالآتي:", "(a)الاحتجاج ٥٠ يورو؛", "(b)الاستئناف على قرار الاحتجاج ١٠٠ يورو؛", "(c)رسوم الاحتجاج تصبح مستحقة السداد عند تسليم نموذج الاحتجاج المكتمل إلى عضو لجنة الحكام (Jury Member) ولابد من سداد الرسوم إلى عضو لجنة الحكام (Jury Member) أو اللجنة المنظمة في أقرب وقت ممكن؛ و", "(d)لابد من رد رسوم الاحتجاج أو الاستئناف إذا تم قبول الاحتجاج أو الاستئناف، أما إذا تم رفض الاحتجاج أو الاستئناف، يتم الاحتفاظ بها من قبل اللجنة المنظمة."]}, {"id": "6.16.5", "rule": "6.16.5", "te": "Scoring protests – time limit & EST score protests", "ta": "الاحتجاجات على تقدير الدرجات – الوقت والأهداف الإلكترونية", "cats": ["CMP"], "ev": ["AP10", "P50", "MTQ", "RFP", "SP", "P25"], "en": ["6.16.5  Scoring Protests", "Decisions by the RTS Jury on the value or number of shots on a target are final and may not be appealed.", "6.16.5.1  Scoring Protest Time", "All scoring or results protests must be submitted within 10 minutes after Preliminary Results are posted on the Range Scoreboard (Rule 6.4.2.i).", "The time when the Scoring Protest Time ends must be shown on the Range Scoreboard, when Preliminary Results are posted. The location to which any score protest must be made must be published in the Official Programme.", "6.16.5.2  EST Score Protests", "If an athlete protests the value of an indicated shot on an EST, the protest will only be accepted when it is made before the next shot or series (25m events) is fired or within three (3) minutes after the last shot, however, this requirement does not apply in case of a failure of the paper or rubber band to advance or other target failures.", "a) If a protest is made concerning the value of a shot, the athlete will be requested to fire another shot at the end of the competition, so that this extra shot may be counted if the protest is upheld and the correct value of the disputed shot cannot be determined;", "b) If the RTS Jury determines that a protested shot scores within two (2) decimal rings of the value of an indicated shot, the protest must not be upheld;", "c) If the protest concerning a shot value, other than zero (0) or failure to register, is not upheld, a two (2) point penalty from the score of the disputed shot will be awarded and the protest fee must be paid;", "d) The team official or athlete has the right to know the resolution of the disputed shot; and", "e) Shots on 50m EST with an indicated value of 9.5 or higher may not be protested in Elimination or Qualification Rounds; and", "f) Score protests regarding the value or number of shots are not permitted in Finals (Rule 6.17.1.7)."], "ar": ["6.16.5 الاحتجاجات على تقدير الدرجات", "قرارات لجنة حكام RTS على قيمة الطلقة أو عدد الطلقات على الهدف هي نهائية ولا يجوز عمل استئناف بشأنها.", "6.16.5.1 وقت الاحتجاجات على تقدير الدرجات", "لابد أن تقدم جميع احتجاجات المتعلقة بالتسجيل أو النتائج خلال 10 دقائق من وقت إعلان النتائج الأولية على لوحة نتائج الميدان (قاعدة 6.4.2.i). ولابد من الإعلان عن وقت انتهاء مهلة الاحتجاج على التسجيل على لوحة نتائج الميدان عند نشر النتائج الأولية. كما أنه لابد من الإعلان عن المكان الذي تقدم فيه احتجاجات النتائج في البرنامج الرسمي للبطولة.", "6.16.5.2 الاحتجاجات على نتائج الأهداف الالكترونية (EST Score Protests)", "إذا احتج اللاعب على قيمة طلقة معلنة على نظام الأهداف الإلكترونية EST، فإن اعتراضه يقبل فقط عندما يقدمه قبل رمى الطلقة التالية أو المجموعة التالية (مسـابقات ٢٥ م) أو خلال ٣ ق بعد إطلاق آخر طلقة. ولا يسري هذا القيد في حالـة فشل تحرك الشريط الورقي أو المطاطي أو عند حدوث أعطال أخرى في الهدف.", "(a)إذا تم تقديم احتجاج بشأن قيمة إحدى الطلقات، فيطلب من اللاعب أن يرمي طلقة أخرى إضافية في نهاية المسابقة، بحيث يمكن احتساب هذه الطلقـة الإضافية في حال قبول الاحتجاج وتعذر تحديد القيمة الصحيحة للطلقة محل الاحتجاج؛", "(b)إذا حددت لجنة حكام RTS أن نتيجة الطلقة محل الاحتجاج تقع ضمن نطاق رقمين عشريين (دائرتين عشريتين) من قيمة الطلقة المعلنة فلا يقبل الاحتجاج؛", "(c)إذا لم يقبل الاحتجاج المتعلق بقيمة طلقة، بخلاف الصفر (٠) أو عدم تسجيل قيمة الطلقة، يتم خصم نقطتين (٢) من نتيجة الطلقة محل الاعتراض ولابد من سداد رسوم الاعتراض؛", "(d)يحق لمسؤول الفريق أو اللاعب معرفة القرار المتخذ بشأن الطلقة محل النزاع؛", "(e)لا يجوز تقديم احتجاج على الطلقات المسجلة على أنظمة الأهداف الالكترونية في ميدان ٥٠م ذات قيمة معلنة قدرها 9.5 أو أعلى خلال مراحل التصفية والتأهيل؛ و", "(f)لا يسمح بتقديم الاحتجاجات على النتائج التي تتعلق بقيمة الطلقة أو بعدد الطلقات في النهائيات (القاعدة 6.17.1.7)"]}, {"id": "6.16.6", "rule": "6.16.6 – 6.16.7", "te": "Appeals", "ta": "الاستئناف", "cats": ["CMP"], "ev": ["AP10", "P50", "MTQ", "RFP", "SP", "P25"], "en": ["6.16.6  Appeals", "If there is a disagreement with a Jury decision, the matter may be appealed to the Jury of Appeal, except that decisions by a Finals Protest Jury (6.17.1.10 d) and decisions by the RTS Jury on the value or number of shots (6.16.5) are final and may not be appealed. Such appeals must be submitted in writing by the team leader or a representative not later than 30 minutes after the Jury decision has been announced. The decision of the Jury of Appeal is final.", "6.16.7 Copies of all decisions regarding written protests and appeals must be forwarded by the Technical Delegate(s) to the ISSF Secretary General together with his Final Report for review by the appropriate Section and Technical Committees."], "ar": ["6.16.6 الاستئناف (Appeals)", "إذا كان هناك عدم موافقة على قرار لجنة الحكام، فيجوز استئناف الأمر أمام لجنة الاستئناف، فيما عدا قرارات لجنة حكام احتجاجات النهائيات (6.17.1.10.d) وقرارات لجنة حكام النتائج RTS المتعلقة بقيمة الطلقات أو عددها (6.16.5) تعد نهائية وغير قابلة للاستئناف. لابد من تقديم هذا الاستئناف كتابة من قبل قائد الفريق أو ممثل عنه في موعد لا يتجاوز ثلاثين 30 دقيقة بعد إعلان قرار لجنة الحكام. ويعد قرار لجنة حكام الاستئناف نهائيًا.", "6.16.7 لابد أن يقوم المندوب الفني (Technical Delegate) بإرسال صور من جميع القرارات المتعلقة بالاحتجاجات المكتوبة والاستئنافات إلى السكرتير العام للاتحاد الدولي لرياضة الرماية مرفقة بتقريره النهائي للمراجعة من قبل القسم المناسب واللجان الفنية."]}, {"id": "6.17.1.7", "rule": "6.17.1.7", "te": "Finals – score protests not permitted", "ta": "النهائيات – الاحتجاجات على النتائج غير مسموح بها", "cats": ["CMP"], "ev": ["FIN10", "RFPMF", "PWF", "MTF"], "en": ["6.17.1.7 Score Protests. Score protests regarding the value or number of shots are not permitted in Finals."], "ar": ["6.17.1.7 الاحتجاجات على النتائج (Score Protests)", "الاحتجاجات بخصوص قيمة الطلقة أو عدد الطلقات غير مسموح بها في النهائيات."]}, {"id": "6.17.1.13", "rule": "6.17.1.13", "te": "Protests in Finals – verbal & immediate, 2 points/hits penalty", "ta": "الاحتجاجات في النهائيات – شفهية وفورية، خصم نقطتين/إصابتين", "cats": ["CMP"], "ev": ["FIN10", "RFPMF", "PWF", "MTF"], "en": ["6.17.1.13 Protests in Finals", "a) Any protests in a Final must be verbal and immediate. Protests are made by the athlete or his coach holding up his hand;", "b) There is no protest fee for a protest in a Final.", "c) Any protest must be decided immediately by the Finals Protest Jury (3.12.3.7, 6.16.6 and 6.17.1.10.d.). A decision by the Finals Protest Jury is final and may not be appealed; and", "d) If a protest in a Final is not upheld, a penalty of two points or two hits must be deducted from the score of the shot or series relating to the protest."], "ar": ["(a)لابد أن يكون أي احتجاج في النهائيات شفهيا وفوريا. ويتم تقديم الاحتجاج من قبل اللاعب أو مدربه وذلك برفع اليد؛", "(b)لا يوجد رسوم احتجاج في النهائيات.", "(c)لابد من الفصل في أي احتجاج فورا من قبل لجنة حكام احتجاجات النهائيات طبقا للمواد", "(3.12.3.7 – 6.16.6 – 6.17.1.10.d). ولا يجوز استئناف قرار لجنة حكام احتجاج النهائيات، و", "(d)إذا لم يقبل الاحتجاج في النهائيات، فلابد من تطبيق العقوبة بخصم نقطتين (2 Points) أو إصابتين (2 Hits) من نتيجة الطلقة أو المجموعة المرتبطة بالاحتجاج."]}, {"id": "6.18.1.9", "rule": "6.18.1.9 – 6.18.1.10", "te": "Mixed Team – EST complaints, score protests & protests", "ta": "الفريق المختلط – شكاوى الأهداف الإلكترونية والاحتجاجات", "cats": ["CMP"], "ev": ["MTQ", "MTF"], "en": ["6.18.1.9 EST Complaints and Score Protests", "a) EST complaints during the Qualification will be decided according to Rule", "6.16.5.2.", "b) See Rule 6.17.1.8 for EST complaints during Finals.", "6.18.1.10 Protests", "a ) Protests during the Qualification will be decided according to Rule 6.16.", "b ) Protests made during Finals will be decided by the Finals Protest Jury according to Rules", "6.17.1.10.d and 6.17.1.13."], "ar": ["6.18.1.9شكاوى أنظمة التسجيل الإلكتروني (EST) والاعتراضات على النتائج", "(a)شكاوى أنظمة التسجيل الإلكترونية أثناء التأهيل يبت فيها طبقا للقاعدة 6.16.5.2.", "(b)أنظر القاعدة 6.17.1.8 لشكاوى أنظمة التسجيل الإلكترونية أثناء النهائيات.", "6.18.1.10 الاحتجاجات", "(a)الاحتجاجات أثناء التأهيل يتم البت فيها طبقا للقاعدة 6.16.", "(b)الاحتجاجات أثناء النهائيات سيقررها لجنة حكام احتجاجات النهائي Finals Protest Jury طبقا للقاعدة 6.17.1.10 d والقاعدة 6.17.1.13."]}, {"id": "6.13.1", "rule": "6.13.1 – 6.13.2", "te": "Malfunctions – definition, Allowable & Non-Allowable (10m / 50m)", "ta": "الأعطال – التعريف، المسموح به وغير المسموح به (١٠م / ٥٠م)", "cats": ["MAL"], "ev": ["AP10", "P50", "MTQ", "FIN10", "MTF"], "en": ["6.13 MALFUNCTIONS", "6.13.1 A malfunction occurs when a gun fails to fire a projectile when the trigger is pulled.", "6.13.2 Malfunctions may be either ALLOWABLE or NON-ALLOWABLE.", "6.13.2.1 Allowable Malfunctions are:", "a) A cartridge fails to fire;", "b) A bullet or pellet is lodged in the barrel; or", "c) The gun fails to fire or function properly and the trigger mechanism has been released.", "6.13.2.2 Non-Allowable Malfunctions are:", "a) The athlete has opened the action of his gun;", "b) The safety was engaged;", "c) The athlete did not properly load his gun;", "d) The athlete did not pull the trigger; or", "e) The malfunction is due to any cause that could reasonably have been corrected by the athlete.", "f) When electronic trigger is used, the battery fails."], "ar": ["6.13الأعطال", "6.13.1 يحدث العطل عندما يفشل السلاح في إطلاق المقذوف عند الضغط على الزناد.", "6.13.2 الأعطال قد تكون مسموح بها أو غير مسموح بها.", "6.13.2.1 الأعطال المسموح بها هي:", "(a)طلقة كاذبة؛", "(b)انحشار المقذوف أو الرشة في الماسورة؛ أو", "(c)فشل السلاح في الإطلاق أو في العمل بشكل صحيح بالرغم من تحرير آلية الزناد.", "6.13.2.2 الأعطال الغير مسموح بها هي:", "(a)قام الرامي بفتح آلية (أجزاء) سلاحه؛", "(b)كان أمان السلاح في وضع التشغيل؛", "(c)اللاعب لم يقم بتعمير السلاح بالشكل الصحيح؛", "(d)اللاعب لم يسحب الزناد؛ أو", "(e)العطل يرجع عن سبب كان يمكن للاعب تصحيحه بشكل معقول.", "(f)فشل البطارية في حالة استخدام الزناد الالكتروني"]}, {"id": "6.13.3", "rule": "6.13.3 – 6.13.8", "te": "Repairing / replacing a gun, no extra time, documentation", "ta": "إصلاح أو استبدال السلاح، عدم منح وقت إضافي، التوثيق", "cats": ["MAL"], "ev": ["AP10", "P50", "MTQ", "RFP", "SP", "P25"], "en": ["6.13.3 If an athlete has a gun or ammunition malfunction, he may repair it and continue shooting or, if the malfunction was an ALLOWABLE malfunction, he may continue shooting with another gun of the same type and calibre that complies with these Rules. The replacement gun will be subject to targeted testing.", "6.13.4 No extra competition time is allowed to repair or replace a gun after any malfunction in 10m, 50m and 300m Rifle or Pistol Elimination or Qualification Rounds, but the Jury may allow an athlete to fire additional sighting shots after repairing or replacing a malfunctioning gun if the malfunction was ALLOWABLE.", "6.13.5 Specific rules concerning malfunctions in 25m Pistol events are found in Rule 8.9.3.", "6.13.6 Specific rules concerning malfunctions in Finals are found in Rules 6.17.1.6, 6.17.4.m and 6.17.5.l.", "(6.17.1.6,6.17.4.m & 6.17.5.1)", "6.13.7 Specific rules concerning malfunctions in shotgun are found in Rules 9.11.", "6.13.8 Range Officers, Referees or Jury Members must ensure that malfunctions are documented on Range Incident Reports or Malfunction Score Computation Forms and in the Range Register."], "ar": ["6.13.3 إذا كان اللاعب لديه عطل سلاح أو ذخيرة ، فيمكنه إصلاحه ومواصلة الرمي أو، إذا كان العطل مسموحا به، فيمكن أن يستمر في الرمي بسلاح آخر من نفس النوع والعيار الذي يتوافق مع هذه القواعد. استبدال السلاح سوف يخضع للفحص المستهدف.", "6.13.4 لا يسمح بوقت مباراة إضافي لإصلاح أو استبدال السلاح بعد حدوث أي عطل في ١٠م، ٥٠م، ٣٠٠م بندقية أو مسدس في مسابقات التصفية أو التأهيل، ولكن يجوز للجنة الحكام أن تسمح للاعب بإطلاق طلقات اختبار إضافية بعد إصلاح أو استبدال السلاح المتعطل إذا كان العطل من الأعطال المسموح بها.", "6.13.5 قواعد محددة بخصوص الأعطال في مسابقات المسدس ٢٥م موجودة في القاعدة (8.9.3)", "6.13.6 قواعد محددة بخصوص الأعطال في النهائيات موجودة في القواعد", "6.13.7 ترد القواعد الخاصة بالأعطال في مسابقات الخرطوش في القاعدة .9.11", "6.13.8 لابد أن يضمن ضباط الميدان أو أعضاء لجنة الحكام توثيق الأعطال في تقارير وقائع الميدان أو في نماذج احتساب الأعطال وفي سجل الميدان."]}, {"id": "6.11.1.2", "rule": "6.11.1.2 f) g)", "te": "Unfired shots in MATCH time / lateral move on 10m EST", "ta": "الطلقات التي لم تُطلق في زمن المباراة / التحرك الجانبي على أهداف ١٠م", "cats": ["IRR", "INT"], "ev": ["AP10", "P50", "MTQ"], "en": ["f) A shot or shots that are not fired during the MATCH firing time must be scored as miss(es) on the last competition target(s), unless the CRO or a Jury Member has authorized extra time; and", "g) If, during MATCH firing on 10m ESTs, the Jury directs an athlete to move his position laterally (sideways) within his firing point by 30 cm or more, the athlete may be offered additional sighters and 2 minutes additional time before he resumes MATCH firing."], "ar": ["(f)الطلقة أو الطلقات التي لم تطلق أثناء زمن المباراة لابد من احتسابها صفر/أصفار على الهدف/الأهداف الأخيرة في المنافسة، ما لم يكن CRO أو لجنة الحكام (Jury) قد أذن بالوقت الاضافي. و", "(g)إذا حدث أثناء المباراة في ١٠م على الأهداف الإلكترونية، وقامت لجنة الحكام (Jury) بتوجيه اللاعب لتحريك وضعه أفقيا (جانبيا) داخل نقطة رميه لمسافة 30 سم أو أكثر، فيمكن منحه طلقات اختبار إضافية، بالإضافة إلى دقيقتين (2) وقت إضافي قبل أن يستأنف رمي طلقات المباراة."]}, {"id": "6.11.1.3", "rule": "6.11.1.3", "te": "Shots fired after “STOP”", "ta": "طلقات بعد الأمر “STOP”", "cats": ["IRR"], "ev": ["AP10", "P50", "MTQ"], "en": ["6.11.1.3 “STOP” COMMAND", "The competition must stop at the command “STOP.”", "a) If a shot(s) is fired after the command “STOP,” that shot(s) must be scored as a miss; and", "b) If the shot(s) cannot be identified, the best hit(s) must be deducted from the score of that target and scored as miss(es)."], "ar": ["6.11.1.3 الأمر STOP”\"", "لابد أن تتوقف المباراة عند الأمر \"STOP\"", "(a)لو أطلقت طلقة/طلقات بعد الأمر (STOP) فلابد من تسجيلها صفر/أصفار؛ و", "(b)لو هناك طلقة/طلقات لم يتم التعرف عليها، لابد خصم الطلقة الأفضل من نتيجة هذا الهدف ويتم احتسابها صفر/أصفار."]}, {"id": "6.11.2", "rule": "6.11.2.1 – 6.11.2.3", "te": "10m – release of propelling charge, dry firing, cylinder change", "ta": "١٠م – إطلاق الشحنة الدافعة، الرمي الجاف، تغيير الأسطوانة", "cats": ["IRR"], "ev": ["AP10", "MTQ", "FIN10", "MTF"], "en": ["6.11.2 Specific Rules for 10m Air Gun Events", "6.11.2.1 If an athlete releases the propelling charge prior to the Preparation and Sighting Time he must be given a WARNING (Yellow Card) for the first violation and a DEDUCTION (Green Card) of two (2) points from the lowest value shot of the first MATCH series for the second and subsequent violations.", "6.11.2.2 Any release of the propelling charge, after MATCH firing starts, without a hit on the target will be scored as a miss. Dry firing without release of the propelling charge is permitted except during Finals.", "6.11.2.3 If an athlete wishes to change, or to fill, a gas or air cylinder, he must leave the firing point to do so, after obtaining permission from the Range Officer. No extra time is allowed to change or fill a gas or air cylinder during a competition."], "ar": ["6.11.2 القواعد الخاصة بمسابقات ١٠م أسلحة ضغط الهواء", "6.11.2.1 إذا قام اللاعب بإطلاق شحنة دافعة (هواء) قبل زمن الإعداد والاختبار فإنه لابد من إعطائه إنذار (بطاقة صفراء) للمخالفة الأولى وخصم (البطاقة الخضراء) اثنين (2) نقطة من قيمة أقل طلقة في المجموعة الأولى في المباراة عن المخالفة الثانية واللاحقة.", "6.11.2.2 أي إفراج عن شحنة دافعة (هواء)، بعد بداية المباراة (MATCH)، دون إصابة على الهدف تسجل صفر. ويسمح بالرمي الجاف بدون الإفراج عن شحنة دافعة (هواء) ماعدا أثناء النهائيات.", "6.11.2.3 إذا رغب اللاعب في تغيير أو ملء أسطوانة الغاز أو الهواء، فلابد أن يغادر نقطة الرمي للقيام بذلك، وبعد الحصول على إذن من ضابط الميدان. ولا يمنح وقت إضافي لتغيير أو تعبئة الغاز أو أسطوانة الهواء أثناء المباراة."]}, {"id": "6.11.2.4", "rule": "6.11.2.4", "te": "10m – gun loaded with more than one pellet", "ta": "١٠م – تعمير السلاح بأكثر من رشة", "cats": ["IRR", "LOAD"], "ev": ["AP10", "MTQ", "FIN10", "MTF"], "en": ["6.11.2.4 The gun may only be loaded with one (1) pellet. When a gun is accidentally loaded with more than one (1) pellet:", "a) If the athlete is aware of the situation, he must raise his non-shooting hand to indicate to a Range Officer that he has a problem. A Range Officer must then supervise the unloading of the gun and no penalty will be incurred. No extra time will be allowed for this; or", "b) If the athlete is unaware of the situation and fires two pellets at the same time, he must report this to a Range Officer. If there are two (2) hits on the target, the score of the higher value shot will be counted and the second shot will be annulled. If there is only one (1) hit on the target, this will be counted."], "ar": ["6.11.2.4 يمكن تعمير السلاح برشة واحدة فقط. عندما يتم تعمير السلاح بالخطأ بأكثر من رشة واحدة:", "(a)إذا كان اللاعب على بينة من الموقف، فلابد أن يرفع يده الغير مستخدمة في الرمي للإشارة إلى ضابط الميدان أن لديه مشكلة. وحينها لابد أن يقوم ضابط الميدان بالإشراف على تفريغ السلاح ولا يتم تطبيق أي عقوبة. ولن يسمح بوقت إضافي من أجل ذلك؛ أو", "(b)إذا كان اللاعب يجهل الموقف وأطلق رشتين (عدد ٢ رشة) في الوقت نفسه، فلابد أن يبلغ هذا إلى ضابط الميدان. إذا كان هناك إصابتين اثنين (2) على الهدف، فيتم احتساب الطلقة ذات القيمة الأعلى وتلغى الطلقة الثانية. إذا كان هناك إصابة واحدة فقط (1) على الهدف، فتحتسب هذه الإصابة."]}, {"id": "6.11.3", "rule": "6.11.3", "te": "Interruptions (10m / 50m) – extra time & sighters", "ta": "انقطاع الرمي (١٠م / ٥٠م) – وقت إضافي وطلقات اختبار", "cats": ["INT"], "ev": ["AP10", "P50", "MTQ"], "en": ["6.11.3 Interruptions in 10m Events, 50m Rifle and Pistol Events and 300m Rifle Events", "6.11.3.1 If an athlete must stop firing for more than three (3) minutes through no fault of his own and this interruption was not caused by a malfunction of his gun or ammunition, he may demand extra time equal to the amount of time lost, or the time remaining when the interruption occurred, plus one (1) minute, if during the last five (5) minutes of the competition.", "6.11.3.2 If an athlete is interrupted for more than five (5) minutes through no fault of his own and this interruption was not caused by a malfunction of his gun or ammunition, or if the athlete is moved to another firing point, he may have additional unlimited sighting shots at the beginning of his remaining shooting time together with any time extension granted plus an additional five (5) minutes.", "a) Range Officers or Jury Members must ensure that a complete explanation is recorded on a Range Incident Report; and", "b) Any extension of time allowed by the Jury or Range Officers must be documented, stating the reason on a Range Incident Report."], "ar": ["6.11.3 انقطاع الرمي في مسابقات ١٠م و٥٠م بندقية ومسدس و٣٠٠م بندقية", "6.11.3.1 إذا اضطر اللاعب أن يتوقف عن الرمي لأكثر من ثلاث (3) دقائق دون أي خطأ من جانبه ولم يكن سبب هذا الانقطاع ناتجا عن عطل من سلاحه أو ذخيرته، فيجوز له المطالبة بوقت إضافي يعادل مدة الوقت المفقود، أو الوقت المتبقي عند وقوع الانقطاع، بالإضافة إلى (1) دقيقة واحدة، إذا حدث ذلك خلال الخمس (5) دقائق الأخيرة من المباراة.", "6.11.3.2 إذا توقف اللاعب لأكثر من خمس (5) دقائق دون أي خطأ من جانبه، ولم يكن سبب هذا الانقطاع عطل من سلاحه أو ذخيرته، أو إذا تم نقل اللاعب إلى نقطة رمي أخرى، فيجوز إعطائه عدد غير محدود من طلقات الاختبار في بداية وقت الرمي المتبقي له مع أي وقت ممنوح له بالإضافة إلى ٥ دقائق أخرى..", "(a)لابد أن يتأكد ضباط الميدان أو أعضاء لجنة الحكام (Jury Members) أنه قد تم تسجيل شرح كامل للواقعة في تقرير وقائع/أحداث الميدان. و", "(b)لابد من توثيق أي تمديد للوقت المسموح به من قبل لجنة الحكام (Jury) أو ضباط الميدان (RO)، مشيرا إلى السبب في تقرير وقائع/أحداث الميدان."]}, {"id": "6.11.5", "rule": "6.11.5", "te": "Too many shots in an event (10m / 50m)", "ta": "طلقات أكثر من المقرر (١٠م / ٥٠م)", "cats": ["IRR"], "ev": ["AP10", "P50", "MTQ"], "en": ["6.11.5 Irregular Shots -- Too Many Shots in an Event or Position", "If an athlete in a 10m, 50m or 300m event fires more shots in the event or position than are provided for in the programme, the extra shot(s) must be annulled on the last competition target(s). If the shot(s) cannot be identified, the highest value shot(s) must be annulled on the last competition target.", "The athlete must also be penalized by a deduction of two (2) points for each excessive shot fired, deducted from the lowest value shot(s) in the first series."], "ar": ["6.11.5 الطلقات المخالفة للقواعد – طلقات أكثر من المقرر", "إذا أطلق اللاعب في مسابقات ١٠م، ٥٠م، ٣٠٠م عددا من الطلقات أكثر مما هو منصوص عليه في البرنامج في مسابقة أو وضع، فإن فلابد أن تلغى الطلقة/الطلقات الزائدة على آخر هدف/أهداف في المباراة. إذا تعذر التعرف على الطلقة/الطلقات فإن الطلقات ذات القيمة الأعلى يتم إلغاؤها من الهدف الأخير من المباراة. ولابد أيضا أن يعاقب اللاعب بخصم نقطتين (2) عن كل طلقة زائدة أطلقها يتم خصمها من أقل الطلقات قيمة في المجموعة الأولى."]}, {"id": "6.11.6", "rule": "6.11.6", "te": "Crossfires", "ta": "الطلقات المتقاطعة", "cats": ["IRR"], "ev": ["AP10", "P50", "MTQ", "RFP", "SP", "P25"], "en": ["6.11.6 Crossfires", "6.11.6.1 Crossfires of competition shots must be scored as misses.", "6.11.6.2 If an athlete crossfires a sighting shot on the sighting target of another athlete no penalty is incurred.", "6.11.6.3 If an athlete crossfires a sighting shot on the MATCH target of another athlete, he must be penalized by the deduction of two (2) points from his own score deducted from the first series.", "6.11.6.4 If an athlete receives a confirmed crossfire shot and it is impossible to determine which shot is his, he must be credited with the value of the highest undetermined shot.", "6.11.6.5 If there are more hits on an athlete’s MATCH target than are provided for in the programme, and if it is impossible to confirm that another athlete(s) fired the shot(s), the hit(s) of the highest value must be nullified. Apply rule 6.11.5", "6.11.6.6 If an athlete wishes to disclaim a shot on his target, he must report this immediately to a Range Officer.", "6.11.6.7 If the Range Officer confirms that the athlete did not fire the disputed shot(s), he must make the necessary entry on a Range Incident Report and on the Range Register and the shot must be annulled.", "6.11.6.8 If the Range Officer cannot confirm beyond all reasonable doubt that the athlete did not fire the disputed shot(s), the shot(s) must be credited to the athlete and must be so recorded.", "6.11.6.9 The following must be considered as reasons to justify the annulment of a shot:", "a) If a Range Officer confirms by his observation of the athlete and the target that the athlete did not fire the shot;", "b) If a missing shot is reported by another athlete or a Range Officer at approximately the same time, and from within the neighbouring two or three firing points; and", "c) When using 300m EST with shot sensors, crossfires should not register on the recipient’s target, but an indication will be received at the control centre. The firer, whose target does not receive the expected shot, will be given a miss (zero) and an indication that he has cross-fired."], "ar": ["6.11.6 الطلقات المتقاطعة (Crossfires)", "6.11.6.1 الطلقات المتقاطعة في المحتسب يتم تسجيلها أصفار.", "6.11.6.2 لو أطلق اللاعب طلقة اختبار متقاطعة على هدف اختبار للاعب آخر فلا تطبق عليه أية عقوبة.", "6.11.6.3 لو أطلق اللاعب طلقة اختبار متقاطعة على هدف مباراة للاعب آخر، لابد من عقوبته بخصم نقطتين من درجاته، وتخصم من المجموعة الأولى.", "6.11.6.4 لو تلقى اللاعب طلقة مقاطعة مؤكدة وكان من المستحيل تحديد أي طلقة هي طلقته، فلابد أن تحتسب له الطلقة الأعلى قيمة.", "6.11.6.5 إذا كان هناك على هدف اللاعب طلقات محتسبة أكثر من المقرر في البرنامج، ومن المستحيل التأكد أن هناك لاعب/لاعبين آخر/آخرين قد أطلق الطلقة/الطلقات الزائدة، فلابد من إلغاء الإصابة/الإصابات ذات القيمة الأعلى. تطبق القاعدة 6.11.5", "6.11.6.6 إذا رغب اللاعب في عدم احتساب طلقة على هدفه، فلابد أن يقوم بإبلاغ ضابط الميدان فورا.", "6.11.6.7 إذا أكد ضابط الميدان أن اللاعب لم يطلق الطلقة/الطلقات المتنازع عليها، فلابد أن يثبت ذلك في تقرير وقائع/أحداث الميدان وفي سجل الميدان ولابد أن تلغى الطلقة.", "6.11.6.8 إذا لم يتمكن ضابط الميدان التأكيد بلا أدنى شك معقول أن اللاعب لم يطلق الطلقة/الطلقات المتنازع عليها، فإن هذه الطلقة/الطلقات تحتسب للاعب ويتم تسجيلها له.", "6.11.6.9 لابد من النظر فيما يلي كمبررات لإلغاء الطلقة:", "(a)إذا أكد ضابط الميدان من ملاحظته للاعب والهدف أن اللاعب لم يطلق الطلقة؛", "(b)إذا تم الإبلاغ عن طلقة مفقودة بواسطة لاعب آخر أو ضابط الميدان في نفس الوقت تقريبا، ومن ضمن نقاط الرمي الإثنين أو الثلاث المجاورة؛ و", "(c)عند استخدام الأهداف الالكترونية ٣٠٠م مع أجهزة استشعار الطلقة (حساسات)، فإن الطلقات المتقاطعة لا يجب أن تسجل على الهدف المتلقي، ولكن سوف تصل إشارة بذلك إلى مركز التحكم. والرامي الذي لم يتلق هدفه طلقة سيتم إعطاء صفر عن هذه الطلقة مع تزويده بإشارة تفيد بحدوث طلقة متقاطعة (Cross-fired) منه."]}, {"id": "6.11.7", "rule": "6.11.7", "te": "Disturbances (10m / 50m)", "ta": "الإزعاج (١٠م / ٥٠م)", "cats": ["DIS"], "ev": ["AP10", "P50", "MTQ"], "en": ["6.11.7 Disturbances", "If an athlete claims that he was disturbed while firing a shot, he must keep his gun pointed downrange and immediately inform the Range Officer or Jury Member. He must not disturb other athletes. If the claim is considered justified, the shot(s) must be annulled and the athlete may repeat the shot(s) or series. If the claim is not considered justified, the shot(s) must be credited to the athlete and he may continue shooting; no penalty will be applied."], "ar": ["6.11.7 الإزعاج (Disturbances)", "إذا ادعى أحد اللاعبين انه قد أزعج أثناء إطلاق طلقة، فلابد من أن يحتفظ بسلاحه مشار في اتجاه الميدان نحو الأهداف وعلى الفور يقوم بإبلاغ ضابط الميدان أو عضو لجنة الحكام. ولابد ألا يزعج اللاعبين الآخرين. وإذا اعتبرت شكواه لها ما يبررها، فالطلقة/الطلقات لابد أن تلغى ويمكن للاعب أن يعيد رمي الطلقة أو المجموعة. إن لم تعتبر شكواه لها ما يبررها فلابد أن تحتسب الطلقة/الطلقات للاعب ويمكنه أن يستمر في الرمي. ولا يتم تطبيق أي عقوبة."]}, {"id": "6.17.1.6", "rule": "6.17.1.6", "te": "Malfunctions in 10m / 50m Finals", "ta": "أعطال نهائيات ١٠م و٥٠م", "cats": ["MAL"], "ev": ["FIN10", "MTF"], "en": ["6.17.1.6 Malfunctions, 10m and 50m Finals. If a finalist has an ALLOWABLEmalfunction (Rule 6.13.2) during a single shot, a maximum of one (1) min. will be given to repair the malfunction or replace the gun, after which the athlete will be directed to repeat the shot. If a finalist has an ALLOWABLE malfunction in a 5-shot or 10-shot series and the malfunction can be repaired or the gun replaced within one (1) min., any shots fired in that series will be counted and the athlete will be permitted to complete the series within the time remaining when the malfunction was claimed plus additional time equal to the time required to repair the malfunction, but not exceeding one (1) min. Finalists may have only one ALLOWABLE MALFUNCTION per Final."], "ar": ["6.17.1.6 أعطال نهائيات ١٠م و٥٠م.", "لو حدث للاعب النهائيات عطل مسموح به (قاعدة 6.13.2) أثناء رمي طلقة فردية، فيتم إعطائه دقيقة واحدة (١) بحد أقصى لإصلاح العطل أو استبدال السلاح، وبعد ذلك سيتم توجيه اللاعب لإعادة رمي الطلقة. وإذا حدث للاعب عطل مسموح به في مجموعة من ٥ طلقات أو ١٠ طلقات، وكان من الممكن إصلاح العطل أو استبدال السلاح خلال دقيقة واحدة، فإن أي الطلقات التي قد أطلقت في هذه المجموعة سيتم احتسابها وسيسمح للاعب باستكمال المجموعة خلال الوقت المتبقي عند الإبلاغ عن العطل بالإضافة إلى وقت إضافي يساوي زمن إصلاح العطل، على ألا يتعدى دقيقة واحدة. ويسمح لكل لاعب في النهائيات بعطل واحد مسموح به (ALLOWABLE MALFUNCTION) خلال النهائيات."]}, {"id": "6.17.1.8", "rule": "6.17.1.8 a) – d)", "te": "EST complaints during Finals – unregistered shot / unexpected zero", "ta": "شكاوى الأهداف الإلكترونية في النهائيات – طلقة لم تسجل / صفر غير متوقع", "cats": ["EST", "CMP"], "ev": ["FIN10", "RFPMF", "PWF", "MTF"], "en": ["6.17.1.8 EST Complaints During Finals", "a) If a finalist complains that his target failed to register a shot during Sighting shots, the athlete must be directed to fire another shot at that target. If that shot registers, the Final will continue. If that shot does not register or if there is a complaint regarding the failure of a paper/rubber strip to advance, the CRO must command “STOP…UNLOAD” for all finalists and the athlete with the malfunctioning target must be moved to a reserve target. As soon as that athlete is in position on a spare target, the CRO will give all finalists two (2) minutes preparation time and then restart the Preparation and Sighting Time for the Final.", "b)  If there is a complaint concerning an unexpected zero (0) (missing shot) during a MATCH shot/series, the Jury (Jury Member-in-Charge, second Competition Jury Member and one RTS) must determine whether the missing shot actually was a miss (0) or if the target malfunctioned (the Jury may direct the CRO to stop firing so they can examine the target). Unless the Jury finds credible evidence that the shot missed the target, it shall direct the athlete to fire another competition shot (10m/50m), 25m Pistol Women series completion (one shot) or a 25m Rapid-Fire Men series. If the extra competition shot registers, the value of that shot shall be counted in lieu of the unexpected zero (missing shot) and the Final shall continue. In a 25m Rapid-Fire Men Final, the score of the repeat series shall count in lieu of the hit total of the original series.", "c) If the shot fired on a target that had the unexplained miss does not register,the athlete must be moved to a reserve target (25m RFP to another target group). In 10m or 50m Finals, the athlete who was moved to a reserve target must be given two (2) minutes Preparation and Sighting Time. The athlete who is moved must, on command, be allowed to fire the missing competition shot, series completion or refire series (25m RFP) before competition firing continues for all athletes.", "d) During any delay in competition firing, other finalists are permitted to do aiming exercises and dry fire. If the total delay to resolve the unexplained miss issue is longer than five (5) minutes, all athletes in 10m and 50m Finals must be given two (2) minutes Sighting time before competition firing resumes."], "ar": ["6.17.1.8 شكاوى أنظمة الأهداف الالكترونية أثناء النهائيات", "(a)إذا اشتكى اللاعب أن هدفه لم يسجل طلقة أثناء رمي طلقات الاختبار، فلابد من توجيه اللاعب أن يطلق طلقة أخرى على الهدف. فإذا تم تسجيل هذه الطلقة، النهائي. أما إذا لم يتم تسجيل هذه الطلقة أو إذا كان هناك شكوى متعلقة بعدم تحرك الشريط الورقي/المطاطي، فلابد أن يعطي رئيس ضباط الميدان CRO الأمر لجميع اللاعبين \"STOP.. UNLOAD\" وينقل اللاعب الذي لديه عطل في هدفه إلى هدف احتياطي. وبمجرد أن يأخذ اللاعب وضعه على الهدف الاحتياطي، يعطي رئيس ضباط الميدان جميع اللاعبين دقيقتين (٢) زمن إعداد ثم بعد ذلك يعيد بدء وقت الإعداد والاختبار للنهائي.", "(b)إذا كانت هناك شكوى تتعلق بتسجيل صفر غير متوقع (0) (طلقة مفقودة) أثناء طلقة / مجموعة في المباراة، فلابد أن تقوم لجنة الحكام (عضو لجنة الحكام المسئول Jury Member-in Charge، وعضو لجنة حكام المباراة الثاني Second Competition Jury Member وعضو واحد من RTS) بتحديد ما إذا كانت الطلقة المفقودة هي صفر (٠) فعلا أم أن هناك عطل في الهدف (ويجوز أن توجه لجنة الحكام \"Jury\" ضباط الميدان CRO لإيقاف الرمي حتى تتمكن من فحص الهدف). ما لم تجد لجنة الحكام أدلة معقولة تثبت أن الطلقة لم تصب الهدف، فإنها سوف تطلب من اللاعب إطلاق طلقة مباراة أخرى (١٠م و٥٠م)، أوفي مسدس ٢٥م (سيدات) استكمال المجموعة (طلقة واحدة) أو مجموعة في حالة المسدس السريع رجال ٢٥م. لو تم تسجيل طلقة المباراة الإضافية، فسوف تحتسب قيمة هذه الطلقة بدلا من الصفر غير المتوقع ويستمر النهائي. في نهائيات ٢٥م مسدس سريع رجال، فإن نتيجة المجموعة المعادة يتم احتسابها بدلا من المجموعة الأصلية.", "(c)إذا لم تسجل الطلقة التي أطلقت على الهدف الذي كان موضوع شكوى الصفر (٠) غير المتوقع ولم يتم تسجيلها، فلابد من نقل اللاعب إلى هدف احتياطي (٢٥م مسدس سريع RFP إلى مجموعة أهداف). وفي نهائيات ١٠م و٥٠م، فإن اللاعب الذي تم نقله إلى هدف احتياطي لابد أن يمنح دقيقتين (٢) زمن إعداد واختبار. ولابد من السماح للاعب المنقول، عند صدور الأمر، برمي طلقة المباراة المفقودة، أو استكمال المجــموعة أو إعادة المجموعة (٢٥م مسدس سريع رجال) وذلك قبل استئناف المباراة لجميع اللاعبين.", "(d)أثناء أي تأخير في رمي المباراة، فإنه مسموح لباقي اللاعبين بعمل تدريبات التصويب والرمي الجاف. إذا كان التأخير الإجمالي لحل مشكلة الطلقة صفر (٠) غير المتوقعة قد تجاوز خمس (٥) دقائق، في ١٠م و٥٠م، فلابد من إعطاء جميع اللاعبين دقيقتين (٢) اختبار قبل استئناف المباراة."]}, {"id": "6.17.1.14h", "rule": "6.17.1.14 h) i)", "te": "Finals – firing before START/LOAD, firing after STOP", "ta": "النهائيات – الإطلاق قبل START/LOAD، والإطلاق بعد STOP", "cats": ["IRR"], "ev": ["FIN10", "RFPMF", "PWF", "MTF"], "en": ["h) Firing before START or LOAD command. If a finalist in a 10m, 25m or 50m Final loads and fires a shot before the “PREPARATION AND SIGHTING TIME…START” command or before the “FOR THE SIGHTING SERIES… LOAD” command, he must be disqualified.", "i) Firing after STOP command. If a finalist fires a shot after the “PREPARATION AND SIGHTING TIME… STOP” command or the “CHANGE-OVER AND SIGHTING TIME…STOP” command and before the “START” command for the next competition series, the shot must not be counted as a MATCH shot and a two (2) point penalty must be applied to the first MATCH shot."], "ar": ["(h)إطلاق طلقة قبل النداء START أو LOAD. إذا قام لاعب النهائيات في ١٠م، ٢٥م، أو ٥٠م بالتعمير والرمي قبل “PREPARATION AND SIGHTING TIME …. START أو قبل الأمر “FOR THE SIGHTING SERIES …. LOAD” ، لابد من استبعاده (must be disqualified).", "(i)إطلاق طلقة بعد الأمر STOP.إذا قام لاعب النهائيات بإطلاق طلقة بعد الأمر:", "“PREPARATION AND SIGHTING TIME …. STOP” أو الأمر:", "“CHANGEOVER AND SIGHTING TIME…STOP” وقبل الأمر “START” لمجموعة المباراة التالية، فلا تحتسب كطلقة مباراة ولابد من توقيع الجزاء عليه بخصم نقطتين (٢) من أول طلقة محتسبة في المباراة."]}, {"id": "6.17.1.14j", "rule": "6.17.1.14 j)", "te": "25m Finals – early firing", "ta": "نهائيات ٢٥م – الإطلاق المبكر", "cats": ["IRR"], "ev": ["RFPMF", "PWF"], "en": ["j) 25m Pistol – early firing. If a finalist in a 25m Rapid-Fire Pistol Men Final fires a shot before the green light for a series comes on, but after the series has started, the entire series must be scored as score of four remaining shots and 1 Hit penalty is applied. If a finalist in a 25m Pistol Women Final fires a shot before the green light for a shot comes on but after series has started, that shot will be scored as a miss and a one (1) hit penalty will be deducted from the score of the series. Series is considered started after command ATTENTION. If a shot is fired before series is started the shot must not be counted as a competition shot and one (1) HIT must be deducted from the score of the repeated or completed series. Athlete which fired accidentally must not continue but must act as in 8.8.2.3. If the procedure is not followed, and the athlete continues the original series, the score will be the same as if the series has already started."], "ar": ["(j)مسدس ٢٥م – إطلاق مبكر.", "نهائي المسدس السريع ٢٥م للرجال (RFPM):", "إذا قام لاعب نهائيات ٢٥م مسدس سريع رجال بإطلاق طلقة قبل الضوء الأخضر للمجموعة، ولكن بعد بداية المجموعة، فيجب احتساب نتيجة المجموعة على أساس أربع (٤) طلقات متبقية فقط، مع تطبيق عقوبة خصم إصابة واحدة (1 HIT).", "نهائي مسدس ٢٥م للسيدات (25m Pistol Women):", "إذا أطلقت اللاعبة طلقة قبل إضاءة الضوء الأخضر، ولكن بعد بداية المجموعة، تحتسب هذه الطلقة صفر (MISS)، ويتم خصم إصابة واحدة من نتيجة المجموعة.", "تعتبر المجموعة قد بدأت بعد صدور الأمر “ATTENTION”.", "إذا أطلقت الطلقة قبل بداية المجموعة، فلا يجب احتسابها طلقة مباراة، ولابد من خصم إصابة واحدة (1 HIT) من نتيجة المجموعة المعدة أو المستكملة.", "ويجب على اللاعب الذي أطلق الطلقة عن طريق الخطأ عدم الاستمرار في الرمي، وأن يتصرف وفقا للقاعدة 8.8.2.3. إذا لم يتبع هذا الإجراء واستمر اللاعب في المجموعة الأصلية، تحتسب النتيجة كما لو أن المجموعة كانت قد بدأت بالفعل."]}, {"id": "6.17.1.14k", "rule": "6.17.1.14 k) l) m)", "te": "Finals – 10m early firing, extra shot, inadvertent firing", "ta": "النهائيات – إطلاق مبكر ١٠م، طلقة إضافية، إطلاق عن غير قصد", "cats": ["IRR"], "ev": ["FIN10", "RFPMF", "PWF", "MTF"], "en": ["k) 10m Rifle & Pistol – early firing. If an athlete in a 10m Final fires a shot after the ‘’LOAD” command but before the “START” command the shot will be scored as a miss.", "l ) Firing extra shot. If a finalist fires an extra shot in a series or single shot time, the extra shot must be nullified and a two (2) point/hit penalty must be applied to the last correct shot/series.", "m) Firing inadvertently. If a finalist who is not involved in a shoot-off or malfunction completion/refire loads and fires a shot that shot must be nullified. There is no penalty for this inadvertent mistake."], "ar": ["(k)بندقية ومسدس ١٠م – الإطلاق المبكر. إذا أطلق أحد اللاعبين في نهائيات ١٠م طلقة بعد صدور الأمر “LOAD” وقبل صدور الأمر “START”، تحتسب هذه الطلقة صفر (MISS).", "(l)إطلاق طلقة إضافية. إذا أطلق أحد اللاعبين طلقة إضافية في مجموعة أو خلال زمن طلقة فردية، فيجب الغاء الطلقة الإضافية، وتطبيق عقوبة خصم (٢) نقطتين/إصابتين من آخر طلقة/مجموعة صحيحة.", "(m)إطلاق نار عن غير قصد. إذا قام لاعب النهائيات غير اللاعبين المشاركين في كسر التعادل (shoot-off) أو استكمال/إعادة الرمي بسبب عطل، بتعمير السلاح وإطلاق طلقة، فلابد من إلغاء هذه الطلقة. ولا يوقع عليه جزاء على هذا الخطأ غير المقصود."]}, {"id": "6.17.1.14r", "rule": "6.17.1.14 r)", "te": "Finals – one malfunction per athlete, 1 minute", "ta": "النهائيات – عطل واحد لكل لاعب، دقيقة واحدة", "cats": ["MAL"], "ev": ["FIN10", "RFPMF", "PWF", "MTF"], "en": ["r) Malfunctions. Only one (1) malfunction will be allowed for each athlete throughout the Final. Athletes may be allowed one (1) minute to repair or replace a malfunctioning firearm to permit the Final to continue without unnecessary delay."], "ar": ["(r)الأعطال. يسمح لكل لاعب بعطل واحد (١) فقط طوال فترة النهائيات. يمكن السماح للاعب بدقيقة (١) واحدة لإصلاح أو استبدال السلاح المعطل وذلك للسماح باستمرار النهائيات بدون أي تأخير غي ضروري."]}, {"id": "6.17.4m", "rule": "6.17.4 m)", "te": "RFPM Final – late & irregular shots", "ta": "نهائي المسدس السريع رجال – الطلقات المتأخرة وغير العادية", "cats": ["IRR"], "ev": ["RFPMF"], "en": ["If an athlete fires a late shot or does not shoot at all five (5) targets in time, a", "deduction of one (1) hit for each overtime or unfired shot will be taken from the score for that series. The shot(s) will be marked with “OT.” If an athlete fires 2 shots on the same target, the second shot on the target will be counted as a miss, and one (1) HIT penalty will be applied to the score of that series."], "ar": ["إذا أطلق اللاعب طلقة متأخرة، أو لم يتمكن من الرمي على جميع الأهداف الخمسة (5) خلال الزمن المحدد، يتم خصم إصابة واحدة (1 HIT) عن كل طلقة متأخرة أو غير مُنفَّذة من مجموع نتيجة تلك المجموعة.", "وتُعلَّم هذه الطلقات بالرمز “OT”.", "إذا أطلق اللاعب طلقتين على نفس الهدف، تُحتسب الطلقة الثانية على ذلك الهدف كخطأ (Miss)، كما يتم تطبيق عقوبة خصم إصابة واحدة (1 HIT) من نتيجة تلك المجموعة."]}, {"id": "6.17.4o", "rule": "6.17.4 o)", "te": "RFPM Final – malfunctions", "ta": "نهائي المسدس السريع رجال – الأعطال", "cats": ["MAL"], "ev": ["RFPMF"], "en": ["Malfunctions during the sighting series may not be claimed or refired. Only one malfunction (ALLOWABLE or NON-ALLOWABLE) may be claimed during the MATCH series. If a malfunction occurs during a MATCH series, a Range Officer must determine if the malfunction is ALLOWABLE or NON- ALLOWABLE. If the malfunction is ALLOWABLE, the athlete must repeat the series immediately, while the other finalists standby, and will receive the score of the repeat series. The athlete has 20 seconds to be ready for the repeat series. If malfunction is NON-ALLOWABLE, a penalty of two (2) hits must be deducted from the score for that series. For any further malfunction, a Range Officer must determine if the malfunction is ALLOWABLE or NON-ALLOWABLE, no repeat series is permitted and the hits that are displayed will be counted, if malfunction is ALLOWABLE. If the malfunction is NON-ALLOWABLE, a penalty of two (2) hits must be deducted from the score for that series."], "ar": ["الأعطال أثناء مجموعة الاختبار (Sighting Series)", "لا يجوز الادعاء بوجود عطل أو إعادة المجموعة في حال حدوث عطل أثناء مجموعة الاختبار.", "الأعطال أثناء مجموعة مباراة (MATCH Series)", "يُسمح بالادعاء بحدوث عطل واحد فقط خلال مجموعات المباراة، سواء كان العطل مسموحًا به (ALLOWABLE) أو غير مسموح به (NON-ALLOWABLE).", "عند حدوث عطل أثناء مجموعة مباراة MATCH، يجب على ضابط الميدان (Range Officer) تحديد ما إذا كان العطل مسموحًا به أو غير مسموح به:", "إذا كان العطل مسموحًا به (ALLOWABLE):", "يُطلب من اللاعب إعادة المجموعة فورًا، بينما ينتظر باقي اللاعبين.", "يتم احتساب نتيجة المجموعة المعادة.", "يجب أن يكون اللاعب جاهزًا خلال 20 ثانية لإعادة المجموعة.", "إذا كان العطل غير مسموح به (NON-ALLOWABLE):", "يتم تطبيق عقوبة خصم إصابتين 2 HIT)) من نتيجة تلك المجموعة.", "الأعطال اللاحقة", "في حال حدوث أي عطل إضافي بعد العطل الأول، يقوم ضابط الميدان بتحديد ما إذا كان العطل مسموحًا به أو غير مسموح به، وفي جميع الأحوال لا يُسمح بإعادة المجموعة:", "إذا كان العطل مسموحًا به (ALLOWABLE):", "يتم احتساب الإصابات التي ظهرت على الهدف.", "إذا كان العطل غير مسموح به (NON-ALLOWABLE):", "يتم تطبيق عقوبة خصم إصابتين 2 HIT)) من نتيجة تلك المجموعة."]}, {"id": "6.17.5k", "rule": "6.17.5 k)", "te": "25m Pistol Women Final – malfunctions", "ta": "نهائي مسدس ٢٥م سيدات – الأعطال", "cats": ["MAL"], "ev": ["PWF"], "en": ["Malfunctions during the Sighting series may not be claimed or completed. Only one malfunction (ALLOWABLE or NON-ALLOWABLE) may be claimed during a Final. If a malfunction occurs during a MATCH series, a Range Officer must determine if the malfunction is ALLOWABLE or NON- ALLOWABLE. If the malfunction is ALLOWABLE, the athlete must complete the series immediately while the other finalists stand by. The athlete has 15 sec. to be ready for the series completion. For any further malfunctions, no series completion is permitted and the hits that are displayed will be counted."], "ar": ["الأعطال لا يمكن الادعاء بها أثناء مجموعة الاختبار ولا يستكمل رميها. يمكن الادعاء بعطل واحد فقط (مسموح به – أو غير مسموح به) أثناء النهائي. لو حدث عطل أثناء المباراة، فلابد أن يحدد ضابط الميدان ما إذا كان العطل مسموح به أو غير مسموح به. إذا كان العطل مسموح به، فلابد أن تستكمل اللاعبة المجموعة فورا، بينما تبقى اللاعبات الأخريات في حالة الاستعداد. واللاعبة لديها ١٥ ثانية لتكون جاهزة لاستكمال المجموعة. وفي حالة أي أعطال أخرى لا يسمح باستكمال رمي المجموعة ويتم احتساب الإصابات الموجودة."]}, {"id": "6.18.1.8", "rule": "6.18.1.8", "te": "Mixed Team – firearm malfunctions", "ta": "الفريق المختلط – أعطال الأسلحة", "cats": ["MAL"], "ev": ["MTQ", "MTF"], "en": ["6.18.1.8 Firearm Malfunctions", "a) Malfunctions in Qualification will be governed according to Rule 6.13.", "b) Malfunctions in the Final will be governed according to Rule 6.17.1.6. (Only one (1) allowable malfunction is permitted for each team)."], "ar": ["6.18.1.8أعطال الأسلحة", "(a)تطبق قواعد الأعطال أثناء مرحلة التصفيات وفقًا للقاعدة 6.13.", "(b)تُطبَّق قواعد الأعطال أثناء النهائي وفقًا للقاعدة 6.17.1.6. (يُسمح بعطل مسموح واحد فقط (1) لكل فريق)."]}, {"id": "8.7.4", "rule": "8.7.4", "te": "25m – Ready Position violations", "ta": "٢٥م – مخالفات وضع الاستعداد", "cats": ["RDY"], "ev": ["RFP", "SP", "P25"], "en": ["8.7.4  Procedures for Ready Position Violations", "WHEN A READY POSITION VIOLATION OCCURS;", "a) The athlete must be warned by a Jury Member and the series must be recorded and repeated;", "b) When the series is repeated in the 25m Rapid-Fire Pistol event, the athlete must be credited with the lowest value hit on each target. In all other 25m events, the athlete must be credited with the fi
