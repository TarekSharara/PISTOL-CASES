ve (5) lowest value hits in the two (2) series (or three (3) series should a malfunction be involved);", "c) If the fault is repeated in the same stage of 30 shots in the 25m Rapid-fire Pistol event, or in the Rapid-fire Stage of the 25m Pistol or 25m Centre Fire Pistol event, or in the combined 20 second and 10 second stages of the 25m Standard Pistol event, the same procedure must be applied and the athlete must be penalized by a deduction of two (2) points from his score; and", "d) If a third violation of this Rule occurs, the athlete must be disqualified."], "ar": ["8.7.4 الإجراءات المتبعة في حالات مخالفة وضع الاستعداد", "عندما حدوث حالات مخالفة وضع الاستعداد؛", "(a)لابد من إنذار اللاعب بواسطة عضو لجنة الحكام ويتم تسجيل المجموعة وتعاد؛", "(b)عندما يتم إعادة المجموعة في مسابقة المسدس السريع ٢٥م، لابد من أن يحتسب للاعب أقل قيمة إصابة على كل هدف. في كل مسابقات ٢٥م الأخرى لابد من أن يحتسب للاعب أقل خمس (٥) درجات قيمة في المجموعتين أو الثلاث (٣) مجموعات إذا كان هناك عطل؛", "(c)إذا تكرر الخطأ في نفس المرحلة من 30 طلقة في مسابقة المسدس السريع ٢٥م، أو في مرحلة الرمي السريع في مسابقة مسدس ٢٥م أو المسدس المركزي ٢٥م، أو في مرحلتي ٢٠ ثانية و١٠ ثانية (مجتمعتين) في المسدس الموحد، لابد من تطبيق نفس الإجراءات ولابد من توقيع العقاب على اللاعب بخصم نقطتين (٢) من نتيجته.", "d)) إذا وقع انتهاك ثالث لهذه القاعدة، فلابد من استبعاد اللاعب."]}, {"id": "8.7.6.2", "rule": "8.7.6.2 c) – e)", "te": "25m – LOAD: too many cartridges / magazines, shot before LOAD", "ta": "٢٥م – التعمير: طلقات أو خزن أكثر من المسموح، طلقة قبل LOAD", "cats": ["LOAD", "IRR"], "ev": ["RFP", "SP", "P25"], "en": ["c) “LOAD.” In all 25m Training or Qualification events, only one (1) magazine or pistol may be loaded with not more than five (5) cartridges on the command “LOAD.” Nothing else is allowed to be inserted into the magazine;", "d) If an athlete in Qualification loads his pistol with more cartridges than he is allowed to load (full series or series completion) or he loads more than one (1) magazine on any command “LOAD” he must be penalized by the deduction of two (2) points from his score in that same series. If the athlete violates this rule in Training, he must be directed to unload his pistol, insert a safety flag and stop training.", "e) An athlete who fires a shot or shots before the command “LOAD” must be disqualified; and"], "ar": ["(c)عمر (LOAD) في جميع التدريبات أو مسابقات التأهل ٢٥م، يمكن تعمير خزنة واحدة (١) فقط أو تعمير المسدس بعدد لا يزيد عن (٥) طلقات على الأمر “LOAD”. لا يسمح بإدخال أي شيء آخر في الخزنة أو الساقية (الأسطوانة)؛", "(d)إذا قام اللاعب في مباراة التأهيل بتعمير مسدسه بطلقات أكثر من المسموح به (مجموعة كاملة أو استكمال مجموعة) أو أنه عمر أكثر من خزنة واحدة (1) عند صدور أي أمر” LOAD” فإنه لابد أن يعاقب بخصم نقطتين (2) من نتيجته في نفس هذه المجموعة. وإذا خالف اللاعب هذه القاعدة أثناء التدريب، فلابد أن يتم توجيهه إلى تفريغ سلاحه ووضع علم الأمان به والتوقف عن التدريب.", "(e)اللاعب الذي يطلق طلقة أو طلقات قبل الأمر “LOAD” فلابد من أن يتم استبعاده. و"]}, {"id": "8.7.6.3d", "rule": "8.7.6.3 d)", "te": "25m RFP – when the malfunction series is re-fired", "ta": "المسدس السريع ٢٥م – توقيت إعادة مجموعة العطل", "cats": ["MAL"], "ev": ["RFP"], "en": ["d) If a pistol of any of the athletes firing together has a malfunction, the malfunction series must be re-fired by those concerned in the same time stage with the following regular series. The final series of this stage will be fired immediately after all other athletes firing together have completed this time stage. Each Range Section may operate independently;"], "ar": ["(d)إذا حدث عطل لأي من اللاعبين اللذين يرميان سويا، فلابد من إعادة مجموعة العطل في نفس مرحلة الوقت مع المجموعة التالية العادية. المجموعة النهائية من هذه المرحلة يتم رميها فور انتهاء جميع اللاعبين الآخرين، الذين يرمون معا، من رمي هذه المرحلة. كل قسم في الميدان يمكن أن يعمل بشكل مستقل؛"]}, {"id": "8.8.1", "rule": "8.8.1", "te": "Interruptions in 25m events", "ta": "الانقطاعات في مسابقات ٢٥م", "cats": ["INT"], "ev": ["RFP", "SP", "P25"], "en": ["8.8 INTERRUPTIONS AND IRREGULARITIES", "8.8.1  Interruptions in 25m Events and Stages", "If shooting is interrupted for safety or technical reasons (without being the fault of the athlete):", "a) If the elapsed interruption time is more than 15min., the Jury must allow one (1) extra sighting series of five (5) shots;", "b) In the 25m Rapid-fire Pistol and in the 25m Standard Pistol event, if the series is interrupted it must be annulled and repeated. The repeated series must be recorded and credited to the athlete;", "c) In the 25m Pistol and the 25m Centre Fire Pistol events, the interrupted series must be completed. The completed series must be recorded and credited to the athlete; and", "d) In the Precision Stage the time limit is forty-eight (48) seconds for every shot to be fired to complete the series."], "ar": ["8.8 الانقطاع والمخالفات", "8.8.1 الانقطاعات في مسابقات ومراحل ٢٥م", "إذا توقف الرمي لأسباب تتعلق بالسلامة أو لأسباب فنية (دون أن يكون ذلك بسبب خطأ من اللاعب):", "(a)إذا كان الوقت الذي انقضى أكثر من 15 دقيقة، فلابد على لجنة الحكام السماح بمجموعة اختبار واحدة (1) إضافية من خمسة (5) طلقات؛", "(b)في مسابقات المسدس السريع ٢٥م والمسدس الموحد ٢٥م، إذا انقطعت مجموعة فلابد من الغاء هذه المجموعة وإعادتها. ولابد أن تسجل المجموعة المعادة وتحتسب نتيجتها للاعب؛", "(c)في مسابقات مسدس ٢٥م والمسدس المركزي ٢٥م، لابد أن تستكمل المجموعة التي حدث فيها الانقطاع. ولابد أن تسجل المجموعة المستكملة وتحتسب نتيجتها للاعب. و", "(d)في مرحلة الرمي البطيء فإن زمن كل طلقة ثمان وأربعين (٤٨) ثانية يتم رميها لاستكمال المجموعة."]}, {"id": "8.8.2.1", "rule": "8.8.2.1", "te": "Too many MATCH shots (25m)", "ta": "طلقات مباراة أكثر من المقرر (٢٥م)", "cats": ["IRR"], "ev": ["RFP", "SP", "P25"], "en": ["8.8.2  Irregular Shots in 25m Events and Stages", "8.8.2.1 Too Many Competition Shots Fired (25m)", "If an athlete fires more MATCH shots on a target than the Pistol Events Qualification Table (Rule 8.11) specifies, or more than one (1) shot at one (1) appearance of the target in a Rapid-Fire Pistol Series, the highest value hit(s) must be disregarded from the score of that target;", "a) Two (2) points must also be deducted from the score of that series for each extra shot fired in the series;", "b) This penalty is in addition to the penalty of two (2) points that may be imposed when an athlete loads more than the authorized number of cartridges; and", "c) Two (2) points must be deducted on every occasion if two (2) shots are fired during a single exposure of the target in the Rapid-Fire stages of the 25m Pistol and the 25m Centre Fire Pistol events."], "ar": ["8.8.2 طلقات مخالفة للقواعد في مسابقات ومراحل ٢٥م", "8.8.2.1 طلقات زائدة تم إطلاقها (أكثر من المقرر)", "إذا أطلق اللاعب عددًا من طلقات المباراة (MATCH) على هدفٍ ما أكثر مما هو محدد في جدول مسابقات تأهيل المسدس (القاعدة 8.11)، أو أطلق أكثر من طلقة واحدة (1) عند ظهورٍ واحدٍ للهدف في مجموعة المسدس السريع (Rapid-Fire Pistol)، فيجب استبعاد أعلى إصابة/إصابات قيمة من نتيجة ذلك الهدف.", "(a)لابد أيضا أن تخصم نقطتين (2) من نتيجة هذه المجموعة عن كل طلقة اضافية أطلقت في المجموعة؛", "(b)هذه العقوبة، بالإضافة إلى عقوبة خصم نقطتين (2) والتي يمكن توقيعها على اللاعب عندما يقوم بتعمير أكثر من العدد المسموح به من الطلقات. و", "(c)لابد أن تخصم نقطتين (2) على كل مرة إذا تم رمي طلقتين (2) خلال الظهور الواحد للهدف في مراحل الرمي السريع من مسابقات المسدس ٢٥م والمسدس المركزي."]}, {"id": "8.8.2.2", "rule": "8.8.2.2", "te": "Too many sighting shots (25m)", "ta": "طلقات اختبار أكثر من المقرر (٢٥م)", "cats": ["IRR"], "ev": ["RFP", "SP", "P25"], "en": ["8.8.2.2  Too Many Sighting Shots Fired (25m)", "If an athlete fires more Sighting shots than are provided for in the Pistol Events Qualification Table (Rule 8.11), or are approved by the Range Officer or Jury, he must be penalized by the deduction of two (2) points from the first series of his MATCH score for each excessive sighting shot fired. This penalty is in addition to the penalty of two (2) points that may be imposed when an athlete loads more than the authorized number of cartridges."], "ar": ["8.8.2.2 طلقات اختبار أكثر من المقرر", "إذا قام اللاعب برمي طلقات اختبار أكثر من العدد المنصوص عليه في جدول مسابقات تأهيل المسدس (القاعدة 8.11)، أو سمح بها ضابط الميدان أو لجنة الحكام، فلابد أن يعاقب بخصم نقطتين (2) من نتيجة المجموعة الأولى من المباراة لكل طلقة اختبار زائدة. هذه العقوبة، بالإضافة إلى عقوبة خصم نقطتين (2) التي يمكن توقيعها عندما يقوم اللاعب بتعمير عدد أكثر من المسموح به من الطلقات."]}, {"id": "8.8.2.3", "rule": "8.8.2.3", "te": "Early or late shots (25m)", "ta": "طلقات مبكرة أو متأخرة (٢٥م)", "cats": ["IRR"], "ev": ["RFP", "SP", "P25"], "en": ["8.8.2.3  Early Or Late Shots (25m)", "a) Any shot(s) fired accidentally after the command “LOAD,” but before the start of a MATCH series, must not be counted in the competition and two (2) points must be deducted from the following series. This penalty must not apply in the Sighting series. The athlete who fired accidentally must not continue, but must wait until the other athletes finish that series and then report this to the Range Officer as if he had a malfunction. The Range Officer will then permit him to continue and repeat the series in the same time stage with the following regular series. The final series of the stage will be fired immediately after all athletes have completed that time stage. If this procedure is not followed and the athlete continues the original series, the accidentally fired shot will be scored as a miss (zero); and", "b) In a Precision Stage, if a shot(s) is fired after the command or signal “STOP,” that shot must be counted as a miss. If the shot(s) cannot be identified the highest value hit(s) must be deducted from the score of that target and scored as miss(es)."], "ar": ["8.8.2.3 طلقات مبكرة أو متأخرة (٢٥م)", "(a)أي طلقة/طلقات أطلقت عن طريق الخطأ بعد الأمر “LOAD”، ولكن قبل بدء مجموعة المباراة، لابد ألا تحتسب في المباراة ولابد من خصم نقطتين (2) من المجموعة التالية. لابد ألا يتم تطبيق هذه العقوبة في مجموعة الاختبار. اللاعب الذي أطلق النار بطريق الخطأ لابد ألا يستمر، ولكن لابد أن ينتظر حتى انتهاء اللاعبين الآخرين من المجموعة ثم يقوم إبلاغ ضابط الميدان بذلك كما لو كان لديه عطل. وسيقوم ضابط الميدان وقتها بالسماح له بالمواصلة وإعادة المجموعة في نفس المرحلة مع المجموعة العادية التالية. سيتم رمي المجموعة الأخيرة من المرحلة فورا بعد انتهاء جميع اللاعبين من تلك المرحلة. إذا لم يتم اتباع هذا الإجراء، واستمر اللاعب في المجموعة الأصلية، سيتم تسجيل الطلقة التي أطلقت عن طريق الخطأ (صفر)؛ و", "(b)في مرحلة الرمي البطيء، إذا أطلقت طلقة/طلقات بعد الأمر أو إشارة “STOP”، لابد أن تحتسب هذه الطلقة (صفر). إذا لم يمكن التعرف على هذه الطلقة/الطلقات فيتم خصم نتيجة أعلى طلقة/طلقات من نتيجة هذا الهدف وتحتسب صفر/أصفار."]}, {"id": "8.8.2.4", "rule": "8.8.2.4", "te": "Crossfires on sighting targets (25m)", "ta": "الطلقات المتقاطعة على أهداف الاختبار (٢٥م)", "cats": ["IRR"], "ev": ["RFP", "SP", "P25"], "en": ["8.8.2.4  Crossfires on Sighting Targets (25m)", "If an athlete fires a Sighting shot on the sighting target of another athlete, he must not be allowed to repeat the shot, but will not be penalized. If it cannot be established clearly and quickly which hit(s) belong to whom, the athlete who is not at fault has the right to repeat the sighting shot(s)."], "ar": ["8.8.2.4 الطلقات المتقاطعة على أهداف اختبار (٢٥م)", "إذا قام اللاعب بإطلاق طلقة اختبار على هدف اختبار للاعب آخر، فلا يسمح له بإعادة الطلقة، ولا تفرض عليه أي عقوبة. وإذا تعذر تحديد هذه الطلقة أو الطلقات بدقة وبسرعة ومن هو اللاعب الذي أطلقها، فيكون من حق اللاعب الذي تلقى هذه الطلقة/الطلقات أن يعيد طلقة/طلقات الاختبار."]}, {"id": "8.8.3", "rule": "8.8.3", "te": "Incorrect range commands (25m)", "ta": "أوامر ميدان غير صحيحة (٢٥م)", "cats": ["TIM"], "ev": ["RFP", "SP", "P25"], "en": ["8.8.3  Incorrect Range Commands (25m)", "a) If, because of an incorrect command and/or action by a Range Officer, the athlete is not ready to fire when the signal to fire is given, he must hold his pistol pointing down range and raise his free hand, and immediately after the series report this to a Range Officer or Jury Member; and", "b) If the claim is considered justified, the athlete must be allowed to fire the series; or", "c) If the claim is considered not justified, the athlete may fire the series, but must be penalized by the deduction of two (2) points from the score of that series; or", "d) If the athlete has fired a shot after the incorrect command and/or action, the protest must not be accepted."], "ar": ["8.8.3 أوامر ميدان غير صحيحة (٢٥م)", "(a)إذا، بسبب وجود أمر (Command) غير صحيح و / أو عمل قام به ضابط الميدان، كان اللاعب غير مستعد للرمي عندما أعطيت إشارة إطلاق النار، لا بد أن يمسك مسدسه مشيرا إلى اتجاه الميدان ويرفع يده الحرة، وعلى الفور بعد المجموعة يقوم بالإبلاغ عن ذلك لضابط الميدان أو عضو لجنة الحكام. و", "(b)إذا اعتبرت شكواه لها ما يبررها، فلابد أن يسمح للاعب برمي المجموعة؛ أو", "(c)إذا اعتبرت شكواه ليس لها ما يبررها، فيمكن للاعب رمي المجموعة، ولكن لابد من عقوبته بخصم نقطتين (2) من نتيجة هذه المجموعة. أو", "(d)إذا أطلق اللاعب طلقة بعد الأمر غير الصحيح و / أو العمل غير الصحيح، فلابد من عدم قبول الاحتجاج."]}, {"id": "8.8.4", "rule": "8.8.4", "te": "Disturbances (25m)", "ta": "الإزعاج (٢٥م)", "cats": ["DIS"], "ev": ["RFP", "SP", "P25"], "en": ["8.8.4  Disturbances", "Should an athlete consider that he was disturbed while firing a shot, he must hold his pistol pointing down range and immediately inform the Range Officer or Jury Member by raising his free hand. He must not disturb other athletes.", "8.8.4.1  IF THE CLAIM IS CONSIDERED JUSTIFIED:", "a) The series (25m Rapid-fire Pistol, 25m Standard Pistol), must be annulled and the athlete may repeat the series; and", "b) The shot (25m Pistol and 25m Centre Fire Pistol) must be annulled and the athlete may repeat the shot and complete the series.", "8.8.4.2  IF THE CLAIM IS CONSIDERED UNJUSTIFIED:", "a) If the athlete has finished his series, the shot or series must be credited to the athlete;", "b) If the athlete has not finished his series due to the claimed disturbance, the athlete may repeat or complete the series. Scoring and penalties are as follows;", "c) In the 25m Rapid-fire Pistol Event the series may be repeated and the score must be recorded as the total of the lowest value hit on each target;", "d) In the 25m Standard Pistol Event the series may be repeated and the score must be recorded as the total of the five (5) lowest value hits on the target;", "e) In the 25m Pistol and 25m Centre Fire Pistol Events the series may be completed and the score must be recorded;", "f) Two (2) points must also be deducted from the score of the repeated or completed series; and", "g) In any repeated series, all five (5) shots must be fired at the target. Any shot(s) not fired or not hitting the target must be scored as a miss(es)."], "ar": ["8.8.4 الإزعاج", "إذا اعتبر اللاعب أنه تم إزعاجه أثناء إطلاقه طلقة، لا بد له من أن يمسك مسدسه موجهه إلى جهة الميدان وعلى الفور يقوم بإبلاغ ضابط الميدان أو عضو لجنة الحكام من خلال رفع يده الحرة. ولابد ألا يزعج اللاعبين الآخرين.", "8.8.4.1 إذا اعتبرت الشكوى لها ما يبررها:", "(a)المجموعة (مسدس سريع ٢٥م، والمسدس الموحد ٢٥م) لابد من إلغائها ويمكن للاعب إعادة المجموعة؛ و", "(b)الطلقة (مسدس ٢٥م والمسدس المركزي ٢٥م) لابد من إلغائها ويمكن للاعب إعادة الطلقة واستكمال المجموعة.", "8.8.4.2إذا اعتبرت الشكوى ليس لها ما يبررها:", "(a)إذا كان اللاعب قد أنهى مجموعته، الطلقة أو المجموعة فلابد أن يتم احتسابها للاعب.", "(b)إذا كان اللاعب لم ينه مجموعته بسبب ادعاء الإزعاج، فيمكن للاعب إعادة أو استكمال المجموعة. احتساب الدرجات والعقوبات كما يلي.", "(c)في مسابقة المسدس السريع ٢٥م يمكن إعادة المجموعة، ولابد أن يتم تسجيل نتيجة أقل طلقة على كل هدف؛", "(d)في مسابقة المسدس الموحد ٢٥م يمكن إعادة المجموعة، ولابد أن يتم احتساب نتيجة قيمة مجموع أقل خمس (5) طلقات على الهدف.", "(e)في مسابقات مسدس ٢٥م والمسدس المركزي ٢٥م قد يتم استكمال المجموعة ولابد أن يتم تسجيل النتيجة.", "(f)لابد أيضا أن تخصم نقطتين (2) من نتيجة المجموعة المعادة أو المستكملة.", "(g)في أي مجموعة معادة، لابد أن تطلق كل الخمسة (5) طلقات على الهدف. أي طلقة/طلقات لم تطلق أو لا تصيب الهدف لابد أن يتم تقديرها (miss) صفر (أصفار)."]}, {"id": "8.8.5", "rule": "8.8.5", "te": "Timing irregularity claims (25m)", "ta": "شكاوى المخالفات الزمنية (٢٥م)", "cats": ["TIM"], "ev": ["RFP", "SP", "P25"], "en": ["8.8.5 Timing Irregularity Claims", "8.8.5.1 If an athlete considers that the time elapsed between the command specified in the Rules and the green light coming on or the facing of the targets was too fast or too slow, and therefore not according to the time specified in the Rules, he must hold his pistol pointing down range and immediately inform a Range Officer or Jury Member by raising his free hand. He must not disturb other athletes.", "a) If it is found that his claim is justified, he may begin the series again; or", "b) If his claim is found not justified, he may fire the series, but a two (2) point penalty must be deducted from the score of that series; and", "c) Once the athlete has fired the first shot in the series, such a claim must not be accepted.", "8.8.5.2  If an athlete considers that the time of the series was too short, he may inform a Range Officer immediately after finishing the series.", "a) The Range Officer and/or Jury must verify the timing of the mechanism; and", "b) If it is confirmed that there has been an error, the protesting athlete’s series must be annulled and repeated; or", "c) If the claim is considered not justified, the result of the series must be credited to the athlete and recorded."], "ar": ["8.8.5 شكاوى المخالفات الزمنية", "8.8.5.1 إذا اعتبر أحد الاعبين أن الوقت بين الأمر (Command) المحدد في القواعد والضوء الأخضر أو كانت مواجهة الأهداف سريعة جدا أو بطيئة جدا، وبالتالي ليس وفقا للوقت المحدد في القواعد، لا بد له من أن يمسك بالمسدس في اتجاه الميدان وعلى الفور يخطر ضابط الميدان أو عضو لجنة الحكام من خلال رفع يده الحرة. ولابد ألا يزعج اللاعبين الآخرين.", "(a)إذا تبين أن مطالبته لها ما يبررها، يمكن أن يبدأ المجموعة مرة أخرى. أو", "(b)إذا تبين أن مطالبته ليس لها ما يبررها، يمكن أن يرمي المجموعة، ولكن لابد أن يتم خصم نقطتين (2) عقوبة من نتيجة هذه المجموعة. و", "(c)بمجرد أن يطلق اللاعب الطلقة الأولى في المجموعة، فلابد ألا يقبل مثل هذا الادعاء.", "8.8.5.2 إذا اعتبر أحد اللاعبين أن وقت المجموعة كان قصير جدا، فيمكنه إخطار ضابط الميدان على الفور بعد الانتهاء من المجموعة.", "(a)لابد أن يتحقق ضابط الميدان و / أو لجنة الحكام من صحة توقيت للأجهزة؛ و", "(b)إذا كان تبين حدوث خطأ، فلابد أن تلغى مجموعة اللاعب المعترض وإعادتها؛ أو", "(c)إذا اعتبر الادعاء ليس له ما يبرره، فإنه لابد أن تحتسب نتيجة المجموعة للاعب وتسجل."]}, {"id": "8.9.1", "rule": "8.9.1", "te": "25m – how many malfunctions may be claimed", "ta": "٢٥م – عدد الأعطال التي يمكن الادعاء بها", "cats": ["MAL"], "ev": ["RFP", "SP", "P25", "RFPMF", "PWF"], "en": ["8.9 MALFUNCTIONS IN 25M EVENTS", "8.9.1 Malfunctions during a sighting series may not be claimed, however, an athlete may clear the malfunction and continue to shoot the unfired shots within the specified time for the sighting series for that event. Only one (1) malfunction (either ALLOWABLE or NON-ALLOWABLE) may be claimed during each MATCH stage(s) of a 25m Pistol event as follows:", "a) Once in each 30 shot stage of the 25m Rapid-Fire Pistol, 25m Pistol and 25m Centre Fire Pistol events;", "b) Twice in the 60-shot Standard Pistol match. NOTE: In exceptional cases, where the match is shot in two stages (see Rule 8.7.6.5.h), then only once in each 30 shot stage of the Standard Pistol match.", "c) The appropriate Malfunction Form (RFPM or STDP) must be used to score repeated malfunction series. Malfunction Forms are found in the General Technical Rules, Rule 6.19.", "d) Malfunctions (ALLOWABLE or NON-ALLOWABLE) in 25m Finals will be decided according to 6.17.4.o) or 6.17.5.k)."], "ar": ["8.9 الأعطال في مسابقات ٢٥م", "8.9.1 لا يجوز الادعاء بالأعطال أثناء مجموعة الاختبار، ومع ذلك، يمكن للاعب إصلاح العطل والاستمرار في رمي الطلقات التي لم يطلقها وذلك خلال الزمن المحدد لمجموعة الاختبار لهذه المباراة. عطل واحد (1) فقط (إما مسموح به أو غير مسموح به) يمكن الادعاء به في كل مرحلة من مراحل المباراة في مسابقات المسدس في ميدان ٢٥م على النحو التالي:", "(a)مرة واحدة في كل مرحلة 30 طلقة من المسدس السريع ٢٥م، ومسدس ٢٥م، والمسدس المركزي ٢٥م؛", "(b)مرتين في مسابقة المسدس الموحد المكوّن من 60 طلقة.", "ملاحظة: في الحالات الاستثنائية التي تُجرى فيها المسابقة على مرحلتين (انظر القاعدة 8.7.6.5.h)، يُسمح بذلك مرة واحدة فقط في كل مرحلة من مرحلتي الـ 30 طلقة في مسابقة المسدس الموحد.", "(c)لابد من استخدام النموذج المناسب للعطل (RFPM – STDP) لتسجيل مجموعة العطل المعادة. نماذج الأعطال توجد في القواعد الفنية العامة، المادة 6.19.", "(d)الأعطال (المسموح بها أو غير المسموح بها) في نهائيات ٢٥م ستتحدد وفقا للمواد 6.17.4.m أو 6.17.5.i."]}, {"id": "8.9.2", "rule": "8.9.2", "te": "25m – repairing or replacing a broken pistol (15 min)", "ta": "٢٥م – إصلاح أو استبدال مسدس مكسور (١٥ دقيقة)", "cats": ["MAL"], "ev": ["RFP", "SP", "P25"], "en": ["8.9.2  Repairing or Replacing a Broken Gun", "Should a pistol break or cease to function, the athlete is allowed to repair or replace the pistol. In all cases, the Chief Range Officer must confirm that the pistol cannot function safely and the Jury must be informed.", "a) An athlete is allowed a maximum of 15min. to repair or replace a pistol in order to resume the competition;", "b) If the repair is likely to take more than 15min., the athlete, at his request, may be granted more time by the Jury;", "c) If extra repair time is granted, he will complete the competition at a time and place determined by the Jury or he may continue to fire with another pistol of the same type of mechanism (semi-automatic or revolver) and of the same calibre; and", "d) In the 25m events the Jury must allow one (1) extra sighting series of five (5) shots."], "ar": ["8.9.2 إصلاح أو استبدال مسدس مكسور", "إذا انكسر مسدس أو توقف عن العمل، يسمح للاعب بإصلاحه أو استبداله في جميع الأحوال، لابد أن يؤكد رئيس ضباط الميدان أن المسدس لا يمكنه العمل بشكل آمن ولابد من إبلاغ لجنة الحكام بذلك.", "(a)يسمح للاعب بحد أقصى 15 دقيقة لإصلاح أو استبدال المسدس من أجل استئناف المباراة؛", "(b)إذا كان الإصلاح من المرجح أن يستغرق أكثر من 15 دقيقة، فيمكن منح اللاعب، بناء على طلبه، المزيد من الوقت من قبل لجنة الحكام؛", "(c)إذا تم منح وقت إضافي للإصلاح، فإنه سوف يستكمل المباراة في الوقت والمكان الذي تحدده لجنة الحكام أو أنه قد يستمر في الرمي بمسدس آخر من نفس النوع من الآلية (نصف آلي أو ساقية) ومن نفس العيار؛ و", "(d)في مسابقات ٢٥م لابد على لجنة الحكام السماح بمجموعة اختبار واحدة (1) إضافية من خمسة (5) طلقات."]}, {"id": "8.9.3", "rule": "8.9.3", "te": "25m – how to claim a malfunction", "ta": "٢٥م – كيفية الادعاء بالعطل", "cats": ["MAL"], "ev": ["RFP", "SP", "P25", "RFPMF", "PWF"], "en": ["8.9.3  Malfunctions in 25m Pistol Events", "a) If a shot has not been fired due to a malfunction, and if the athlete wishes to claim a malfunction, he must hold his pistol pointing down range and must retain his grip. Only the tip of the barrel may rest on the bench, if the magazine is not of the type that is loaded from the barrel end, but the magazine must be clearly not touching the bench or hand and immediately inform a Range Officer by raising his free hand. He must not disturb other athletes.", "b) An athlete may try to correct a malfunction and continue the series, but after attempting any correction, he may not claim an Allowable Malfunction unless the firing pin has broken, or any other part of the pistol is damaged sufficiently to prevent the pistol from functioning."], "ar": ["8.9.3 الأعطال في مسابقات المسدس ٢٥م", "(a)إذا لم تُطلق طلقة بسبب عطل، ورغب اللاعب في المطالبة باعتبار ذلك عطلاً، فعليه أن يُبقي مسدسه موجَّهًا إلى جهة الرمي وأن يحافظ على قبضته. ويجوز فقط أن يرتكز طرف الماسورة على البنش، وذلك إذا لم تكن الخزنة من النوع الذي يُعبَّأ من جهة الماسورة، على أن تكون الخزنة واضحًا أنها لا تلامس البنش ولا اليد. ويجب عليه إبلاغ ضابط الميدان فورًا برفع يده غير المُمسِكة بالسلاح، دون إزعاج باقي اللاعبين.", "(b)يجوز للاعب محاولة إصلاح العطل ومواصلة المجموعة، ولكن بعد الشروع في أي محاولة إصلاح لا يحق له المطالبة باعتبار العطل عطلاً مقبولًا، إلا إذا كانت إبرة ضرب النار قد انكسرت، أو تعرّض أي جزء آخر من المسدس لتلفٍ كافٍ يمنع المسدس من العمل."]}, {"id": "8.9.4.1", "rule": "8.9.4.1", "te": "25m – ALLOWABLE malfunctions (AM)", "ta": "٢٥م – الأعطال المسموح بها (AM)", "cats": ["MAL"], "ev": ["RFP", "SP", "P25", "RFPMF", "PWF"], "en": ["8.9.4 Types of Malfunctions", "8.9.4.1 ALLOWABLE MALFUNCTIONS (AM) are:", "a) A bullet is lodged in the barrel;", "b) The trigger mechanism has failed to operate;", "c) There is an undischarged cartridge in the chamber and the trigger mechanism has been released and operated;", "d) The cartridge case has not been extracted or ejected; this applies even if a case catcher is used;", "e) The cartridge, magazine, cylinder, or other part of the pistol has jammed;", "f) The firing pin has broken, or any other part of the pistol is damaged sufficiently to prevent the pistol from functioning;", "g) The pistol fires automatically without the trigger being released. The athlete must stop firing immediately and must not continue to use such a pistol without the permission of a Range Officer or a Jury Member. When using electronic scoring targets, the first shot will be scored by the system and this will be credited to the athlete. When using paper targets, should the automatically fired shot(s) hit the target, the hit(s) found highest up on the target must be disregarded before the repeat series. After any repeat series, all the shot(s), except those that were disregarded on the one (1) target concerned, must be included to establish the score; or", "h) The slide jams or the empty case is not ejected, this applies even if a case catcher is used."], "ar": ["8.9.4 أنواع الأعطال", "8.9.4.1 الأعطال المسموح بها (AM) هي:", "(a)توقف مقذوف في الماسورة؛", "(b)تعطل آلية عمل الزناد ؛", "(c)هناك طلقة غير مفرغة (كاذبة) في بيت النار وقد تم تحرير وتشغيل آلية الزناد.", "(d)لم يتم قذف الظرف الفارغ أو إخراجه؛ وهذا ينطبق حتى في حالة استخدام حاوية تجميع الفوارغ؛", "(e)انحشرت الطلقة، أو الخزنة، أو الأسطوانة، أو أي جزء آخر من أجزاء المسدس.", "(f)كسر إبرة ضرب النار، أو تلف أي جزء آخر من المسدس بما فيه الكفاية ليمنع المسدس من العمل.", "(g)إذا أطلق المسدس النار تلقائيًا دون ضغط على الزناد، يجب على اللاعب التوقف فورًا عن الرمي، ولا يجوز له الاستمرار في استخدام هذا المسدس إلا بعد الحصول على إذن من ضابط الميدان أو أحد أعضاء لجنة الحكام. عند استخدام الأهداف الإلكترونية، تُسجَّل الطلقة الأولى بواسطة النظام وتُحتسب لصالح اللاعب. وعند استخدام الأهداف الورقية، إذا أصابت الطلقة أو الطلقات التي أُطلقت تلقائيًا الهدف، فيجب استبعاد أعلى إصابة موجودة على الهدف قبل إعادة المجموعة. وبعد إعادة المجموعة، تُحتسب جميع الطلقات، باستثناء الطلقة أو الطلقات التي تم استبعادها على الهدف الواحد المعني، وذلك لتحديد النتيجة النهائية.", "(h)التصاق المنزلق (slide jam) أو عدم قذف الفارغ ، وهذا ينطبق حتى في حالة حاوية تجميع الفوارغ."]}, {"id": "8.9.4.2", "rule": "8.9.4.2", "te": "25m – NON-ALLOWABLE malfunctions (NAM)", "ta": "٢٥م – الأعطال غير المسموح بها (NAM)", "cats": ["MAL"], "ev": ["RFP", "SP", "P25", "RFPMF", "PWF"], "en": ["8.9.4.2 NON-ALLOWABLE MALFUNCTIONS (NAM) are:", "a) The athlete has touched the breech, mechanism or safety catch or the pistol has been touched by another person before being inspected by the Range Officer;", "b) The safety catch has not been released;", "c) The athlete did not load his pistol;", "d) The athlete loaded fewer cartridges than prescribed;", "e) The athlete did not allow the trigger to return far enough after the previous shot;", "f) The pistol was loaded with the wrong ammunition;", "g) The magazine was not inserted correctly, or had fallen out during shooting unless this is due to damage to the mechanism; or", "h) The malfunction is due to any cause that could reasonably have been corrected by the athlete."], "ar": ["8.9.4.2 الأعطال الغير مسموح بها (NAM) هي:", "(a)اللاعب لمس الترباس أو الأجزاء الميكانيكية أو قطعة الأمان، أو تم لمس المسدس بواسطة أي شخص آخر قبل فحصه بواسطة ضابط الميدان؛", "(b)لم يتم فك عتلة الأمان؛", "(c)اللاعب لم يقم بتعمير المسدس؛", "(d) قام اللاعب بتعمير عدد من الطلقات أقل من المقرر؛", "(e)لم يسمح اللاعب للزناد بالعودة بالقدر الكافي بعد الطلقة السابقة؛", "(f)تم تعمير المسدس بالذخيرة الخطأ؛", "(g)لم يتم وضع الخزنة في السلاح بالشكل الصحيح، أو سقطت أثناء الرمي إلا لو كان السبب هو تلف للآلية؛ أو", "(h)يكون العطل ناتجًا عن أي سبب كان من الممكن، بشكل معقول، أن يقوم اللاعب بتصحيحه بنفسه."]}, {"id": "8.9.4.3", "rule": "8.9.4.3", "te": "25m – determining the cause of a malfunction", "ta": "٢٥م – تحديد سبب العطل", "cats": ["MAL"], "ev": ["RFP", "SP", "P25", "RFPMF", "PWF"], "en": ["8.9.4.3 Determining the Cause of a Malfunction", "If the external appearance of the pistol does not show an obvious reason for the malfunction and there is no indication, and the athlete does not claim that there may be a bullet stuck in the barrel, the Range Officer must take the pistol without interfering with or touching the mechanism, point the pistol in a safe direction and pull the trigger one time only to determine whether the trigger mechanism had been released.", "a) If the pistol is a revolver, the Range Officer must not pull the trigger unless the hammer is in the cocked position;", "b) If the pistol does not discharge, the Range Officer must complete the examination of the pistol to determine the cause of the malfunction and to decide whether or not the malfunction is allowable; and", "c) The Range Officer decides, after inspection of the pistol, that there is an ALLOWABLE MALFUNCTION or a NON-ALLOWABLE MALFUNCTION."], "ar": ["8.9.4.3 تحديد سبب العطل", "إذا كان المظهر الخارجي للمسدس لا يظهر سبب واضح للعطل وليس هناك ما يدل على العطل، واللاعب لا يدعي أنه قد يكون هناك رصاصة عالقة في الماسورة، فلابد على ضابط الميدان أن يأخذ المسدس دون تدخل أو لمس للآلية، ويوجه المسدس في اتجاه آمن ويضغط على الزناد مرة واحدة فقط لتحديد ما إذا كان قد تم الإفراج عن آلية الزناد.", "(a)إذا كان المسدس بساقية، فلابد على ضابط الميدان ألا يسحب الزناد إلا لو كان الطارق في وضع التعمير.", "(b)إذا لم يطلق المسدس الطلقة، لابد أن يستكمل ضابط الميدان فحص المسدس لتحديد سبب العطل ويقرر ما إذا كان العطل مسموح به أو لا. و", "(c)بعد فحص المسدس، يقرر ضابط الميدان أن هناك عطل مسموح به أو عطل غير مسموح به."]}, {"id": "8.9.4.4", "rule": "8.9.4.4", "te": "25m – NON-ALLOWABLE malfunction scoring", "ta": "٢٥م – احتساب العطل غير المسموح به", "cats": ["MAL"], "ev": ["RFP", "SP", "P25"], "en": ["8.9.4.4   In the case of a NON-ALLOWABLE MALFUNCTION, every shot that is not fired will be scored as a miss (zero). No re-fire or completion is permitted. Only the values of shots fired will be credited to the athlete. The athlete may continue to shoot the remainder of the event."], "ar": ["8.9.4.4 في حالة عطل غير مسموح به، فكل طلقة لم يتم إطلاقها سيتم احتسابها (miss) صفر. لا يسمح بالإعادة أو الاستكمال. ستقيد فقط قيمة الطلقات التي أطلقها اللاعب. قد يستمر اللاعب في رمي ما تبقى من المسابقة."]}, {"id": "8.9.4.5", "rule": "8.9.4.5", "te": "AM procedure – 25m Rapid-Fire & Standard Pistol (Forms RFPM / STDP)", "ta": "إجراءات العطل المسموح به – المسدس السريع والموحد ٢٥م", "cats": ["MAL"], "ev": ["RFP", "SP"], "en": ["8.9.4.5  ALLOWABLE MALFUNCTION PROCEDURES - 25m Rapid-Fire Pistol and 25m Standard Pistol", "a) If an ALLOWABLE MALFUNCTION occurs during a 25m Rapid-Fire Pistol Men or 25m Standard Pistol Men series, record the scores of the shots that were fired on first line of the Malfunction Form (Form RFPM or Form STDP); and", "b) The athlete must fire all five (5) shots at the target(s) in any repeat series. After the repeat series, record the scores of all shots fired on the second line of the Malfunction Form; any shots not hitting the target or late shots, fired or unfired, must be scored as zero(s); or", "c) If a second malfunction occurs in the repeat series, record the scores of the fired shots in the repeat series on the second line of the Malfunction Form. Then add zeros to the line (first series or repeat series) that has scores for the most fired shots to ensure that one line has five scores. These added zeros must be counted in determining the score for that series; and", "d) Determine the scores of the five shots to be counted for the series and record them on the third line of the Malfunction Form (“Final Score”):", "RFPM: enter the lowest value scores on each of the five targets and total scores.", "STDP: enter the five lowest value scores from all recorded shots, including any zeros that were added to one of the two lines, and total those scores."], "ar": ["8.9.4.5 إجراءات العطل المسموح به – المسدس سريع ٢٥م والمسدس موحد ٢٥م", "(a)إذا حدث عطل مسموح به في مجموعة من مسابقات المسدس السريع ٢٥م أو المسدس الموحد ٢٥م، يتم تسجيل نتيجة الطلقات التي أطلقت في السطر الأول من نموذج الأعطال (نموذج RFPM أو STDP)؛ و", "(b)لابد أن يقوم اللاعب برمي خمس (٥) طلقات على الهدف/الأهداف في أي مجموعة معادة. بعد إعادة المجموعة، يتم تسجيل الطلقات المعادة في السطر الثاني من نموذج الأعطال؛ أي طلقة لم تصب الهدف أو طلقات متأخرة، أطلقت أو لم تطلق، لابد من تسجيلها صفر/أصفار؛ أو", "(c)إذا ظهر عطل ثاني في المجموعة المعادة، سجل درجات الطلقات التي تم إطلاقها في المجموعة المعادة في السطر الثاني من نموذج الأعطال. ثم أضف أصفار للسطر (أول مجموعة أو المجموعة المعادة) التي بها نتيجة للعدد الأكبر من الطلقات وذلك للتأكد من أن هناك سطر واحد به ٥ درجات. لابد من احتساب الأصفار المضافة لتحديد درجات هذه المجموعة، و", "(d)حدد نتيجة الخمس طلقات التي سيتم احتسابها في المجموعة وسجلهم في السطر الثالث في نموذج الأعطال (الدرجة النهائية).", "RFPM: أدخل درجات أقل قيمة لكل هدف من الأهداف الخمسة.", "STDP: أدخل قيمة أقل خمس طلقات من الطلقات المسجلة على الهدف بما في ذلك أي أصفار قد أضيفت إلى أحد السطرين، واجمع هذه الدرجات."]}, {"id": "8.9.4.6", "rule": "8.9.4.6", "te": "AM procedure – 25m Pistol & Centre Fire (series completion)", "ta": "إجراءات العطل المسموح به – مسدس ٢٥م والمركزي (استكمال المجموعة)", "cats": ["MAL"], "ev": ["P25"], "en": ["8.9.4.6 ALLOWABLE MALFUNCTION PROCEDURES - 25m Pistol and 25m Centre Fire Pistol", "Precision and Rapid-Fire Stages:", "a) The number of shots is recorded and the series may be completed;", "b) Shot(s) to complete the series (series completion) must be fired in the next competition series; in the Precision Stage a time of forty-eight (48) seconds will be allowed for each shot to be fired; in the Rapid-Fire Stage, the series completion must start on the first exposure;", "c) Any shot(s) not fired or not hitting the target must be scored as miss(es) (zero(s);", "d) The five-shot series must be scored in the normal manner; and", "e) Use Form IR to report series completion."], "ar": ["8.9.4.6 إجراءات العطل المسموح به – مسدس ٢٥م والمسدس المركزي ٢٥م", "مراحل الرمي البطيء والسريع", "(a)يتم تسجيل عدد الطلقات ويمكن استكمال المجموعة؛", "(b)الطلقة/الطلقات لاستكمال المجموعة لابد من رميها في المجموعة التالية من المباراة؛ في مرحلة الرمي البطيء يسمح بزمن قدره ثمان وأربعين (٤٨) ثانية لرمي كل طلقة؛ في مرحلة الرمي السريع لابد من أن يبدأ استكمال المجموعة في أول ظهور للهدف؛", "(c)أي طلقة/طلقات لم تطلق أو لم تصب الهدف لابد من احتسابها صفر/أصفار؛", "(d)مجموعة الخمس طلقات لابد من تسجيلها بالطريقة العادية؛ و", "(e)استخدم نموذج أحداث الميدان (IR) كتقرير عن استكمال المجموعة."]}, {"id": "8.10.1", "rule": "8.10.1", "te": "Failure of ALL targets on a range / range section (25m)", "ta": "تعطل جميع الأهداف في الميدان أو قسم منه (٢٥م)", "cats": ["EST"], "ev": ["RFP", "SP", "P25"], "en": ["8.10 FAILURE OF EST OR PAPER TARGET SYSTEMS", "8.10.1  Failure of ALL targets on a Range or Range Section", "a) The expired shooting time must be recorded by the Chief Range Officer and the Jury;", "b) All completed MATCH shots of each athlete must be counted and recorded. In the event of a range power supply failure, this may involve waiting until power is restored to enable the number of shots registered by the target, not necessarily on the firing point monitor, to be established;", "c) After the targets are repaired and the full range, or Range Section, is in operation, an additional Sighting series and a one (1) minute pause will be given before starting the completion of the series in accordance with the following rules;", "d) 25m Pistol and 25m Centre Fire Pistol Events. The athletes will COMPLETE the series of five shots in the same way as for an ALLOWABLE MALFUNCTION. The athlete should fire the number of shots that had not been recorded by the target when the failure occurred.", "e) 25m Standard Pistol and 25m Rapid-Fire Pistol Events. If the series was not completed and recorded, it will be annulled and repeated. If the five (5) shots were recorded for any athlete, the series score will be recorded and no repetition will be permitted by that athlete."], "ar": ["8.10 تعطل أنظمة الأهداف الالكترونية أو أنظمة الأهداف الورقية", "8.10.1 تعطل جميع الأهداف في الميدان أو قسم من الميدان", "(a)لابد أن يسجل وقت الرمي المنتهي من قبل رئيس ضباط الميدان ولجنة الحكام؛", "(b)وفي حال حدوث انقطاع في التيار الكهربائي عن الميدان، قد يتطلب الأمر الانتظار حتى عودة التيار الكهربائي للتمكن من تحديد عدد الطلقات التي سجّلها الهدف، وليس بالضرورة تلك المعروضة على شاشة نقطة الرمي.", "(c)بعد إصلاح الأهداف وأصبح كامل الميدان أو قسم الميدان جاهز للتشغيل، تعطى مجموعة اختبار إضافية وتوقف لمدة دقيقة (١) واحدة قبل بداية استكمال المجموعة طبقا للقواعد التالية؛", "(d)مسابقات مسدس ٢٥م والمسدس المركزي ٢٥م. يستكمل اللاعبين مجموعة الخمس طلقات بنفس الطريقة المستخدمة في حالة العطل المسموح به. يجب أن يطلق اللاعب عدد الطلقات التي لم يتم تسجيلها بواسطة الهدف عندما حدث انقطاع التيار.", "(e)مسابقات المسدس الموحد ٢٥م والمسدس السريع ٢٥م. إذا لم يكن قد تم استكمالها وتسجيلها، يتم إلغاؤها وتعاد. إذا تم تسجيل الخمس طلقات لأي لاعب، فإن نتيجة المجموعة يتم احتسابها ولا يسمح لهذا اللاعب بإعادتها."]}, {"id": "8.10.2", "rule": "8.10.2", "te": "Failure of a single target or target group (25m)", "ta": "عطل هدف واحد أو مجموعة أهداف (٢٥م)", "cats": ["EST"], "ev": ["RFP", "SP", "P25"], "en": ["8.10.2  Failure of a Single Target or Target Group", "If there is a failure of a single target or group of five targets (25m Rapid-Fire Pistol event) that cannot be repaired immediately, the athlete will be moved to another firing position in the same, or a following relay. After the problem is resolved, a separate sighting series and a one (1) minute pause will be given before the firing of the next series in accordance with the rule above (8.10.1.c)."], "ar": ["8.10.2 عطل هدف واحد أو مجموعة أهداف", "إذا كان هناك عطل في هدف واحد أو مجموعة من خمسة أهداف (مسابقة مسدس سريع ٢٥م) والذي لا يمكن إصلاحه على الفور، سيتم نقل اللاعب إلى نقطة رمي أخرى في نفس القطار، أو القطار التالي. بعد حل المشكلة، سوف تعطى مجموعة اختبار منفصلة ووقفة لمدة دقيقة واحدة (1) قبل رمي المجموعة التالية وفقا لأحكام الفقرة أعلاه (8.10.1.c)."]}, {"id": "8.10.3", "rule": "8.10.3", "te": "Failure to register or display a shot (25m)", "ta": "عطل في تسجيل أو عرض طلقة (٢٥م)", "cats": ["EST", "CMP"], "ev": ["RFP", "SP", "P25"], "en": ["8.10.3  Failure to Register or Display a Shot", "If there is a complaint concerning failure to register or display a shot on the monitor(s) of 25m Electronic Scoring Target systems, or the monitor shows a zero (0) that was not expected:", "a) In the Precision Stages of 25m Pistol and 25m Centre Fire Pistol events and in the 150sec. series of the 25m Standard Pistol event, the athlete must immediately (before the next shot) inform the nearest range official of the failure;", "b) The athlete will then be directed to complete the series (remaining unfired shots only) at a time decided by the Jury; and", "c) In the Rapid-Fire Stages of the 25m Pistol and 25m Centre Fire Pistol events, and in the 25m Standard Pistol and 25m RFP men events, the athlete must continue the five (5) shot series and must inform the nearest range official of the failure immediately after the end of the series;", "d) There will be no repeat series. The score will be determined by the RTS Jury. After the series has been completed, the Procedure for Examination of Electronic Scoring Targets (6.10.8) will be applied."], "ar": ["8.10.3 عطل في تسجيل أو عرض طلقة", "إذا كان هناك شكوى بشأن عدم تسجيل أو عرض طلقة على الشاشة/الشاشات في أنظمة الأهداف الالكترونية، أو الشاشة تظهر صفر (0) لم يكن متوقعا:", "(a)في مراحل الرمي البطيء في مسابقات مسدس ٢٥م والمسدس المركزي ٢٥م وفي مجموعة زمن ١٥٠ ثانية في المسدس الموحد ٢٥م، لابد أن يقوم اللاعب فورا (قبل الطلقة التالية) بإخطار أقرب مسؤول في الميدان بالعطل؛", "(b)وبعد ذلك يتم توجيه اللاعب لاستكمال المجموعة (الطلقات المتبقية التي لم تطلق فقط) في وقت يحدد من قبل لجنة الحكام ؛ و", "(c)في مراحل الرمي السريع في مسابقات مسدس ٢٥م والمسدس المركزي ٢٥م وفي مراحل الرمي السريع لمسابقة المسدس الموحد ٢٥م وفي مسابقة المسدس السريع، لابد أن يستمر اللاعب في رمي مجموعة الخمس طلقات ولابد أن يخطر أقرب مسؤول في الميدان عن العطل بعد نهاية المجموعة فورا.", "(d)لن يكون هناك مجموعة معادة. وسيتم تحديد النتيجة عن طريق لجنة حكام RTS. بعد أن تم الانتهاء من المجموعة، سيتم تطبيق إجراءات فحص الأهداف الالكترونية (6.10.8)."]}];

"claim25":{"en":["Claim: athlete keeps the pistol pointing down range, retains his grip and raises his free hand. He must not disturb other athletes.","If he attempts any correction, he can no longer claim an ALLOWABLE malfunction (unless the firing pin is broken or a part is damaged so the pistol cannot function).","Range Officer inspects without touching the mechanism and decides AM or NAM."],
 "ar":["الادعاء: يُبقي اللاعب مسدسه موجَّهًا إلى جهة الرمي ويحافظ على قبضته ويرفع يده الحرة، دون إزعاج باقي اللاعبين.","إذا شرع اللاعب في أي محاولة إصلاح، فلا يحق له المطالبة بعطل مسموح به (إلا إذا انكسرت إبرة ضرب النار أو تلف جزء يمنع المسدس من العمل).","يقوم ضابط الميدان بفحص المسدس دون لمس الآلية ويقرر ما إذا كان العطل مسموحًا به أو غير مسموح به."],"rules":["8.9.3","8.9.4.3"]},
"Q1050":{
 "AM":{"en":["Athlete may repair the gun, or continue with another gun of the same type and calibre (replacement gun is subject to targeted testing).","No extra competition time is allowed.","The Jury may allow additional sighting shots after the repair / replacement.","Record on Range Incident Report (IR) and in the Range Register."],
  "ar":["يمكن للاعب إصلاح السلاح، أو الاستمرار بسلاح آخر من نفس النوع والعيار (يخضع السلاح البديل للفحص المستهدف).","لا يُمنح وقت مباراة إضافي.","يجوز للجنة الحكام السماح بطلقات اختبار إضافية بعد الإصلاح أو الاستبدال.","يُسجَّل في تقرير وقائع/أحداث الميدان (IR) وفي سجل الميدان."],"rules":["6.13.1","6.13.3"]},

  "ar":["يمكن للاعب إصلاح السلاح ومواصلة الرمي. لا يُسمح بسلاح بديل إلا في حالة العطل المسموح به.","لا يُمنح وقت مباراة إضافي ولا طلقات اختبار إضافية.","يُسجَّل في تقرير وقائع/أحداث الميدان (IR) وفي سجل الميدان."],"rules":["6.13.1","6.13.3"]}},

  "ar":["دقيقة واحدة (١) بحد أقصى لإصلاح العطل أو استبدال السلاح.","بعد ذلك يتم توجيه اللاعب لإعادة رمي الطلقة.","عطل واحد فقط مسموح به لكل لاعب خلال النهائيات (الفريق المختلط: عطل واحد لكل فريق)."],"rules":["6.17.1.6","6.17.1.14r","6.18.1.8"]},
 "AM_series":{"en":["If repaired or replaced within 1 minute, shots already fired in the series are counted.","Athlete completes the series in the time remaining when the malfunction was claimed + the time used for the repair (max 1 minute).","Only ONE allowable malfunction per Final (Mixed Team: one per team)."],
  "ar":["إذا تم الإصلاح أو الاستبدال خلال دقيقة واحدة، تُحتسب الطلقات التي أُطلقت في المجموعة.","يستكمل اللاعب المجموعة خلال الوقت المتبقي عند الإبلاغ عن العطل + الوقت المستغرق في الإصلاح (بحد أقصى دقيقة واحدة).","عطل واحد فقط مسموح به لكل لاعب خلال النهائيات (الفريق المختلط: عطل واحد لكل فريق)."],"rules":["6.17.1.6","6.17.1.14r","6.18.1.8"]},

  "ar":["لا يُمنح وقت إصلاح ولا إعادة طلقة ولا استكمال مجموعة: القاعدة 6.17.1.6 تمنح ذلك فقط للعطل الواحد المسموح به للاعب في النهائيات.","الحالات غير العادية أو المتنازع عليها تقررها لجنة الحكام وفقًا للقواعد الفنية العامة."],"rules":["6.17.1.6","6.17.1.14r"]}},

  "ar":["لا يجوز الادعاء بالعطل أثناء مجموعة الاختبار.","يمكن للاعب إصلاح العطل ورمي الطلقات التي لم يطلقها خلال الزمن المحدد لمجموعة الاختبار."],"rules":["8.9.1"]},
 "USED":{"en":["No further malfunction (AM or NAM) may be claimed: once in each 30-shot stage (RFP, 25m Pistol, Centre Fire); twice in the 60-shot Standard Pistol match.","No repeat or completion – only the shots fired are credited."],
  "ar":["لا يجوز الادعاء بعطل آخر (مسموح به أو غير مسموح به): مرة واحدة في كل مرحلة 30 طلقة (السريع، مسدس ٢٥م، المركزي)، ومرتين في مسابقة المسدس الموحد 60 طلقة.","لا إعادة ولا استكمال – تُحتسب فقط الطلقات التي أُطلقت."],"rules":["8.9.1","8.9.4.4"]},
 "NAM":{"en":["Every shot not fired is scored as a miss (zero).","No re-fire or completion is permitted. Only the values of shots fired are credited.","The athlete may continue the remainder of the event. This counts as his one claim for the stage."],
  "ar":["كل طلقة لم يتم إطلاقها تُحتسب صفر (miss).","لا يُسمح بالإعادة أو الاستكمال، وتُقيد فقط قيمة الطلقات التي أُطلقت.","يمكن للاعب الاستمرار في رمي ما تبقى من المسابقة، ويُعد هذا هو الادعاء الوحيد له في المرحلة."],"rules":["8.9.4.2","8.9.4.4","8.9.1"]},
 "AM_RFP":{"en":["Record the scores of the shots fired on line 1 of Form RFPM.","The malfunction series is re-fired in the same time stage with the following regular series; the final series of the stage is fired after the other athletes finish that time stage.","All 5 shots must be fired in the repeat; record on line 2. Shots missing the target or late shots (fired or unfired) = zero.","Second malfunction in the repeat: record the fired shots on line 2, then add zeros to the line with the most fired shots so one line has 5 scores.","Line 3 (Final Score): the lowest value on EACH of the five targets."],
  "ar":["تُسجَّل نتيجة الطلقات التي أُطلقت في السطر الأول من نموذج RFPM.","تُعاد مجموعة العطل في نفس مرحلة الوقت مع المجموعة العادية التالية، وتُرمى المجموعة الأخيرة من المرحلة بعد انتهاء باقي اللاعبين من تلك المرحلة.","يجب رمي الخمس طلقات في المجموعة المعادة وتسجيلها في السطر الثاني. الطلقة التي لم تصب الهدف أو المتأخرة (أُطلقت أو لم تُطلق) = صفر.","عطل ثانٍ في المجموعة المعادة: تُسجل الطلقات المطلقة في السطر الثاني، ثم تُضاف أصفار للسطر الذي به العدد الأكبر من الطلقات ليصبح به ٥ درجات.","السطر الثالث (الدرجة النهائية): أقل قيمة على كل هدف من الأهداف الخمسة."],"rules":["8.9.4.5","8.7.6.3d","8.9.1"]},
 "AM_SP":{"en":["Record the scores of the shots fired on line 1 of Form STDP.","All 5 shots must be fired in the repeat series; record on line 2. Shots missing the target or late shots (fired or unfired) = zero.","Second malfunction in the repeat: record the fired shots on line 2, then add zeros to the line with the most fired shots so one line has 5 scores.","Line 3 (Final Score): the FIVE lowest values of all recorded shots (including any added zeros)."],
  "ar":["تُسجَّل نتيجة الطلقات التي أُطلقت في السطر الأول من نموذج STDP.","يجب رمي الخمس طلقات في المجموعة المعادة وتسجيلها في السطر الثاني. الطلقة التي لم تصب الهدف أو المتأخرة (أُطلقت أو لم تُطلق) = صفر.","عطل ثانٍ في المجموعة المعادة: تُسجل الطلقات المطلقة في السطر الثاني، ثم تُضاف أصفار للسطر الذي به العدد الأكبر من الطلقات ليصبح به ٥ درجات.","السطر الثالث (الدرجة النهائية): أقل خمس قيم من جميع الطلقات المسجلة (بما فيها الأصفار المضافة)."],"rules":["8.9.4.5","8.9.1"]},
 "AM_P25":{"en":["Record the number of shots fired; the series may be completed.","Series completion is fired in the next competition series – Precision: 48 seconds per shot; Rapid-Fire: completion starts on the first exposure.","Shots not fired or not hitting the target = miss (zero). The 5-shot series is scored normally.","Use Form IR to report the series completion."],
  "ar":["يُسجَّل عدد الطلقات ويمكن استكمال المجموعة.","يُرمى استكمال المجموعة في المجموعة التالية من المباراة – الرمي البطيء: ٤٨ ثانية لكل طلقة، الرمي السريع: يبدأ الاستكمال في أول ظهور للهدف.","الطلقة التي لم تُطلق أو لم تصب الهدف = صفر. تُسجل مجموعة الخمس طلقات بالطريقة العادية.","يُستخدم نموذج أحداث الميدان (IR) للإبلاغ عن استكمال المجموعة."],"rules":["8.9.4.6","8.9.1"]}},

const AD="٠١٢٣٤٥٦٧٨٩";
function norm(s){
  return s.toLowerCase()
   .replace(/[٠-٩]/g,d=>AD.indexOf(d))
   .replace(/[ً-ْـ]/g,"")
   .replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي");
}

function linkify(html, selfId){
  return html.replace(/(?<![\d.])([68]\.\d{1,2}(?:\.\d{1,2}){0,3})(?:\s?\.?\s?([a-z])\))?/g,(m,num,let)=>{
    const keys=[]; if(let){keys.push(num+let, num+"."+let);} keys.push(num);
    for(const k of keys){
      const id = byId[k]?k:ALIAS[k];
      if(id && byId[id] && id!==selfId) return `<a class="ref" data-go="${id}">${m}</a>`;
    }
    return m;
  });
}
function highlight(html, terms){
  if(!terms.length) return html;
  // highlight on raw text segments outside tags; match on normalized form
  return html.replace(/(^|>)([^<]+)(?=<|$)/g,(all,gt,txt)=>{
    const n = norm(txt); if(n.length!==txt.length) return all; // length-changing normalisation: skip
    const marks=[];
    terms.forEach(t=>{ let i=0; while((i=n.indexOf(t,i))>-1){ marks.push([i,i+t.length]); i+=t.length; } });
    if(!marks.length) return all;
    marks.sort((a,b)=>a[0]-b[0]); let out="",p=0;
    marks.forEach(([a,b])=>{ if(a<p) return; out+=txt.slice(p,a)+"<mark>"+txt.slice(a,b)+"</mark>"; p=b; });
    return gt+out+txt.slice(p);
  });
}

    h += `<div class="result"><h3>Procedure · <span class="ar" dir="rtl">الإجراء</span></h3>${body}
      <div class="sub">Rule text · نص القاعدة</div><div class="rl">${rules.filter(i=>byId[i]).map(i=>`<button data-go="${i}">${byId[i].rule}</button>`).join("")}</div>
      <button class="reset" data-reset="1">Start again · ابدأ من جديد</button></div>`;
  }
  document.getElementById("wsteps").innerHTML = h;
}
document.getElementById("wsteps").addEventListener("click",e=>{
  const go=e.target.closest("[data-go]"); if(go){ goRule(go.dataset.go); return; }
  if(e.target.closest("[data-reset]")){ Object.keys(W).forEach(k=>W[k]=null); wRender(); window.scrollTo(0,0); return; }
  const b=e.target.closest("[data-w]"); if(!b) return;
  const k=b.dataset.w, order=["ev","ser","used","typ","shot"];
  W[k]=b.dataset.v; order.slice(order.indexOf(k)+1).forEach(x=>W[x]=null);
  wRender();
  const steps=document.querySelectorAll("#wsteps .step, #wsteps .result"); const last=steps[steps.length-1];
  if(last && last!==b.closest(".step")) last.scrollIntoView({behavior:"smooth",block:"nearest"});
});

paintChips(); setLang(["en","ar","both"].includes(lang)?lang:"both");
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
